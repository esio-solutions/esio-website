# ──────────────────────────────────────────────────────────────────────────────
# Pages CMS configuration
#   https://pagescms.org/docs/configuration/
#
# This config is the interface contract between the repo and editors using
# pagescms.org. It describes:
#   - where uploaded media lands (static/assets/)
#   - the homepage section data files (data/sections/*.yml) as individual
#     editable forms
#   - the three markdown content collections (articles, posts, legal)
#
# Editing this file changes what editors can edit and how the form looks.
# It does NOT change the data model — that lives in `data/sections/*.yml`
# and the markdown front-matter. Keep this config in sync with those.
# ──────────────────────────────────────────────────────────────────────────────

media:
  - name: assets
    label: Assets (illustrations, logos, etc.)
    input: static/assets
    output: /assets
    extensions: [svg, png, jpg, jpeg, webp, ico]

content:
  # ────────────────────────────────────────────────────────────────────────
  # Homepage page-level metadata
  # ────────────────────────────────────────────────────────────────────────
  - name: home
    label: Homepage metadata
    type: file
    path: content/_index.md
    format: yaml-frontmatter
    fields:
      - { name: title, label: Page title, type: string, required: true }
      - { name: description, label: Meta description, type: text }

  # ────────────────────────────────────────────────────────────────────────
  # Homepage sections — each YAML file shows up as its own form in the CMS
  # ────────────────────────────────────────────────────────────────────────
  - name: nav
    label: Navigation
    type: file
    path: data/sections/nav.yml
    format: yaml
    fields:
      - name: logo
        type: object
        fields:
          - { name: src, type: image, label: Logo }
          - { name: alt, type: string, label: Alt text }
          - { name: href, type: string, label: Link target, default: "/" }
      - name: links
        label: Top-bar links
        type: object
        list: true
        fields:
          - { name: label, type: string, required: true }
          - { name: href, type: string, required: true }
      - name: actions
        label: Right-side buttons
        type: object
        list: true
        fields:
          - { name: label, type: string, required: true }
          - { name: href, type: string, required: true }
          - name: style
            type: select
            options:
              values: [ghost, solid]

  - name: hero
    label: Hero
    type: file
    path: data/sections/hero.yml
    format: yaml
    fields:
      - name: logo
        type: object
        fields:
          - { name: src, type: image, label: Hero logo }
          - { name: alt, type: string }
          - { name: href, type: string, default: "/" }
      - { name: pills, type: string, list: true, label: "Pills (\"Budgeting\", \"Planning\", ...)" }
      - name: headline
        label: Headline
        type: object
        fields:
          - { name: prefix, type: string, label: "Top line" }
          - { name: emphasis, type: string, label: "Emphasised middle line (renders inside <em>)" }
          - { name: suffix, type: string, label: "Bottom line (HTML allowed)" }
      - { name: paragraph, type: text, label: "Body paragraph" }
      - name: actions
        label: CTA buttons
        type: object
        list: true
        fields:
          - { name: label, type: string, required: true }
          - { name: href, type: string, required: true }
          - name: style
            type: select
            options:
              values: [primary, secondary]
      - name: illustrations
        type: object
        fields:
          - name: background
            type: object
            fields:
              - { name: src, type: image, label: Background SVG }
              - { name: alt, type: string }
          - name: foreground
            type: object
            fields:
              - { name: src, type: image, label: Foreground SVG }
              - { name: alt, type: string }

  - name: video
    label: Video section
    type: file
    path: data/sections/video.yml
    format: yaml
    fields:
      - { name: tag, type: string }
      - { name: headline, type: string }
      - { name: subtitle, type: text }
      - name: embed
        type: object
        fields:
          - name: provider
            type: select
            options:
              values: [youtube]
          - { name: id, type: string, label: "Video ID (e.g. znk-ssXoI64)" }
          - { name: title, type: string, label: "Iframe title (a11y)" }
          - { name: params, type: string, label: "URL params (e.g. rel=0&modestbranding=1)" }

  - name: pain
    label: Pain / Problem section
    type: file
    path: data/sections/pain.yml
    format: yaml
    fields:
      - { name: tag, type: string }
      - name: headline
        type: object
        fields:
          - { name: primary, type: string, label: "First line" }
          - { name: emphasis, type: string, label: "Second line" }
      - { name: subtitle, type: text }
      - name: illustration
        type: object
        fields:
          - { name: src, type: image }
          - { name: alt, type: string }
      - name: badges
        label: Floating badges
        type: object
        list: true
        fields:
          - name: id
            type: select
            label: Badge slot
            options:
              values: [b1, b2]
          - { name: label, type: string }
          - { name: value, type: string }
          - { name: trend, type: string }
          - name: trendVariant
            type: select
            required: false
            options:
              values: [deadline]
      - name: cards
        label: Pain cards
        type: object
        list: true
        fields:
          - { name: icon, type: string, label: "Emoji or unicode icon" }
          - { name: title, type: string, required: true }
          - { name: body, type: text, required: true }

  - name: features
    label: Features section
    type: file
    path: data/sections/features.yml
    format: yaml
    fields:
      - name: intro
        label: Intro panel
        type: object
        fields:
          - { name: tag, type: string }
          - { name: headline, type: text, label: "Headline (newline = <br>)" }
          - { name: subtitle, type: text }
          - { name: iconGrid, type: image, list: true, label: "4 icon SVGs" }
          - { name: illustration, type: image, label: "Right-side illustration" }
      - name: panels
        label: Feature panels
        type: object
        list: true
        fields:
          - { name: id, type: string, label: "Slug (cashflow, tax, ...)" }
          - { name: title, type: text, label: "Title (newline = <br>)" }
          - { name: body, type: text, required: true }
          - name: maskIcon
            type: select
            label: "Mask icon (numeric ID, must match esio-iconNN.svg)"
            options:
              values: ["01", "02", "03", "05"]
          - { name: illustration, type: image }
          - { name: flipped, type: boolean, default: false, label: "Mirror illustration horizontally" }

  - name: pricing
    label: Pricing section
    type: file
    path: data/sections/pricing.yml
    format: yaml
    fields:
      - { name: tag, type: string }
      - { name: headline, type: string }
      - { name: subtitle, type: text }
      - name: billingToggle
        type: object
        fields:
          - { name: yearlyLabel, type: string }
          - { name: monthlyLabel, type: string }
          - { name: ariaLabel, type: string }
      - name: tiers
        label: Pricing tiers
        type: object
        list: true
        fields:
          - { name: id, type: string, required: true }
          - { name: name, type: string, required: true }
          - { name: currency, type: string, default: "DKK" }
          - { name: yearlyPrice, type: string, label: "Yearly price (digits only)" }
          - { name: monthlyPrice, type: string, label: "Monthly price (digits only)" }
          - { name: yearlyPeriod, type: string }
          - { name: monthlyPeriod, type: string }
          - { name: description, type: text }
          - { name: features, type: string, list: true, label: "Included features" }
          - name: cta
            type: object
            fields:
              - { name: label, type: string }
              - { name: href, type: string }
              - name: style
                type: select
                options:
                  values: [ghost, featured]
          - { name: featured, type: boolean, default: false, label: "Highlight as the recommended tier" }
          - { name: badge, type: string, required: false, label: "Optional badge text (e.g. Most Popular)" }

  - name: subscribe
    label: Subscribe / Trial section
    type: file
    path: data/sections/subscribe.yml
    format: yaml
    fields:
      - { name: tag, type: string }
      - name: headline
        type: object
        fields:
          - { name: prefix, type: string }
          - { name: suffix, type: string }
      - { name: body, type: text }
      - { name: benefits, type: string, list: true, label: "Benefit bullets" }
      - name: formBox
        type: object
        fields:
          - { name: title, type: string }
          - { name: subtitle, type: text, label: "Subtitle (newline = <br>)" }
          - name: cta
            type: object
            fields:
              - { name: label, type: string }
              - { name: href, type: string }
          - { name: legalNote, type: text }

  - name: footer
    label: Footer
    type: file
    path: data/sections/footer.yml
    format: yaml
    fields:
      - { name: decorations, type: image, list: true, label: "6 decorative SVGs" }
      - name: brand
        type: object
        fields:
          - name: logo
            type: object
            fields:
              - { name: src, type: image }
              - { name: alt, type: string }
          - { name: tagline, type: text }
      - name: columns
        label: Footer columns
        type: object
        list: true
        fields:
          - { name: heading, type: string, required: true }
          - name: links
            type: object
            list: true
            fields:
              - { name: label, type: string, required: true }
              - { name: href, type: string, required: true }
      - name: bottom
        type: object
        fields:
          - { name: copyright, type: string }
          - { name: tagline, type: string }

  # ────────────────────────────────────────────────────────────────────────
  # Markdown content collections
  # ────────────────────────────────────────────────────────────────────────
  - name: articles
    label: Articles
    type: collection
    path: content/articles
    filename: '{primary}.md'
    exclude: ['_index.md']
    format: yaml-frontmatter
    view:
      fields: [title, date, tags]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - { name: title, type: string, required: true }
      - { name: description, type: text, label: "Card / SEO description" }
      - { name: date, type: date, required: true }
      - { name: author, type: string }
      - { name: tags, type: string, list: true }
      - { name: body, type: rich-text, label: Article body }

  - name: posts
    label: Blog posts
    type: collection
    path: content/posts
    filename: '{primary}.md'
    exclude: ['_index.md']
    format: yaml-frontmatter
    view:
      fields: [title, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - { name: title, type: string, required: true }
      - { name: description, type: text, label: "Card / SEO description" }
      - { name: date, type: date, required: true }
      - { name: body, type: rich-text, label: Post body }

  - name: legal
    label: Legal documents
    type: collection
    path: content/legal
    filename: '{primary}.md'
    exclude: ['_index.md']
    format: yaml-frontmatter
    view:
      fields: [title, weight]
      primary: title
      sort: [weight, title]
      default:
        sort: weight
        order: asc
    fields:
      - { name: title, type: string, required: true }
      - { name: description, type: text }
      - { name: date, type: date, label: "Last reviewed" }
      - { name: weight, type: number, default: 99, label: "Sort order (1 = first)" }
      - { name: body, type: rich-text, label: Document body }
