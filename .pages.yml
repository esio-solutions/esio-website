# ──────────────────────────────────────────────────────────────────────────────
# Pages CMS configuration
#   https://pagescms.org/docs/configuration/
#
# This config is the interface contract between the repo and editors using
# pagescms.org. It describes:
#   - where uploaded media lands (static/assets/ + share-cards subfolder)
#   - the homepage section data files (data/<lang>/sections/*.yml) as
#     individual editable forms
#   - the three markdown content collections (articles, posts, legal)
#
# Sidebar layout mirrors the actual page layout — Navigation appears at
# the top because it renders at the top of the site; Footer at the
# bottom for the same reason. Each section is a `type: group` containing
# two file entries — English (en) and Dansk (da) — so an editor first
# picks WHAT they want to edit (Hero, Pain, …) and then chooses the
# language as a sub-step. Editing a single language without scrolling
# past the other language's nine forms is the goal.
#
# Field schemas are defined once on the English entry via YAML anchors
# (&navFields, &heroFields, …) and re-used on the Danish entry via
# *anchor aliases. Editing the English schema cascades to Danish.
#
# List items inside forms use `list.collapsible.summary` so editors see
# meaningful labels (e.g. "Surprise Tax Bills") instead of generic
# "Item #1, Item #2…". Summary supports `{fieldname}` interpolation.
#
# Editing this file changes what editors see and how the form looks.
# It does NOT change the data model — that lives in `data/<lang>/sections/*.yml`
# and the markdown front-matter. Keep this config in sync with those.
# ──────────────────────────────────────────────────────────────────────────────

media:
  - name: assets
    label: Assets (illustrations, logos, etc.)
    input: static/assets
    output: /assets
    extensions: [svg, png, jpg, jpeg, webp, ico]
  - name: share
    label: Social-share cards (per-post 1200x630 OG images)
    input: static/assets/share
    output: /assets/share
    extensions: [jpg, jpeg, png, webp]

content:
  # ────────────────────────────────────────────────────────────────────────
  # Site-wide settings — single file, no language variants
  # ────────────────────────────────────────────────────────────────────────
  - name: site_seo
    label: Site SEO defaults
    type: file
    path: hugo.toml
    format: toml
    fields:
      - name: params
        type: object
        fields:
          - { name: ogImage, type: image, label: "Default social-share image (1200x630, used when a page has no image of its own)" }

  # ────────────────────────────────────────────────────────────────────────
  # Homepage metadata — <title> and <meta description> for the home page.
  # Each page section (nav, hero, …) is a separate group below; this one
  # covers the page-level SEO that wraps the whole homepage.
  # ────────────────────────────────────────────────────────────────────────
  - name: home
    label: Homepage metadata
    type: group
    items:
      - name: en
        label: English
        type: file
        path: content/_index.md
        format: yaml-frontmatter
        fields: &homeFields
          - { name: title, label: Page title, type: string, required: true, default: "ESIO" }
          - { name: description, label: Meta description, type: text }
      - name: da
        label: Dansk
        type: file
        path: content/_index.da.md
        format: yaml-frontmatter
        fields: *homeFields
      - name: hu
        label: Magyar
        type: file
        path: content/_index.hu.md
        format: yaml-frontmatter
        fields: *homeFields

  # ────────────────────────────────────────────────────────────────────────
  # About page — standalone Markdown content at /about/. Body is rich-text
  # so editors can rewrite it through the CMS without touching the file.
  # ────────────────────────────────────────────────────────────────────────
  - name: about
    label: About page
    type: group
    items:
      - name: en
        label: English
        type: file
        path: content/about.md
        format: yaml-frontmatter
        fields: &aboutFields
          - { name: title, type: string, required: true, default: "About ESIO" }
          - { name: description, type: text, label: "Meta description" }
          - { name: date, type: date, required: true, label: "Last reviewed" }
          - { name: body, type: rich-text, label: "Body" }
      - name: da
        label: Dansk
        type: file
        path: content/about.da.md
        format: yaml-frontmatter
        fields: *aboutFields

  # ────────────────────────────────────────────────────────────────────────
  # Contact page — standalone Markdown content at /contact/.
  # ────────────────────────────────────────────────────────────────────────
  - name: contact
    label: Contact page
    type: group
    items:
      - name: en
        label: English
        type: file
        path: content/contact.md
        format: yaml-frontmatter
        fields: &contactFields
          - { name: title, type: string, required: true, default: "Contact" }
          - { name: description, type: text, label: "Meta description" }
          - { name: date, type: date, required: true, label: "Last reviewed" }
          - { name: body, type: rich-text, label: "Body" }
      - name: da
        label: Dansk
        type: file
        path: content/contact.da.md
        format: yaml-frontmatter
        fields: *contactFields

  # ────────────────────────────────────────────────────────────────────────
  # Team section — appears at the bottom of the About page. One YAML file
  # per language so editors can rewrite individual bios per locale.
  # ────────────────────────────────────────────────────────────────────────
  - name: team
    label: Team section
    type: group
    items:
      - name: en
        label: English
        type: file
        path: data/en/sections/team.yml
        format: yaml
        fields: &teamFields
          - name: intro
            label: "Section intro"
            type: object
            fields:
              - { name: tag, type: string, label: "Eyebrow tag (small uppercase)" }
              - { name: headline, type: string }
              - { name: body, type: text }
          - name: members
            label: "Team members"
            type: object
            list:
              collapsible:
                summary: "{name} — {role}"
            fields:
              - { name: name, type: string, required: true }
              - { name: role, type: string }
              - { name: photo, type: image, required: false, label: "Photo (square; falls back to initials when empty)" }
              - { name: bio, type: text }
              - { name: quote, type: string, required: false, label: "Optional pull quote" }
          - name: cta
            label: "Closing CTA"
            type: object
            fields:
              - { name: text, type: string, label: "Lead-in line above the link" }
              - { name: link_label, type: string }
              - { name: link_href, type: string, label: "Link target (mailto:, /contact/, etc.)" }
      - name: da
        label: Dansk
        type: file
        path: data/da/sections/team.yml
        format: yaml
        fields: *teamFields

  # ────────────────────────────────────────────────────────────────────────
  # Page sections — listed in the order they render on the homepage.
  # Each is a group containing the English and Danish data files.
  # ────────────────────────────────────────────────────────────────────────
  - name: nav
    label: Navigation
    type: group
    items:
      - name: en
        label: English
        type: file
        path: data/en/sections/nav.yml
        format: yaml
        fields: &navFields
          - name: logo
            type: object
            fields:
              - { name: src, type: image, label: "Logo (dark theme — usually white-on-transparent)" }
              - { name: srcLight, type: image, label: "Logo (light theme — usually navy-on-transparent)", required: false }
              - { name: alt, type: string, label: Alt text }
              - { name: href, type: string, label: Link target, default: "/" }
          - name: links
            label: Top-bar links
            type: object
            list:
              collapsible:
                summary: "{label} → {href}"
            fields:
              - { name: label, type: string, required: true }
              - { name: href, type: string, required: true }
          - name: actions
            label: Right-side buttons
            type: object
            list:
              collapsible:
                summary: "{label} ({style})"
            fields:
              - { name: label, type: string, required: true }
              - { name: href, type: string, required: true }
              - name: style
                type: select
                options:
                  values: [ghost, solid]
      - name: da
        label: Dansk
        type: file
        path: data/da/sections/nav.yml
        format: yaml
        fields: *navFields
      - name: hu
        label: Magyar
        type: file
        path: data/hu/sections/nav.yml
        format: yaml
        fields: *navFields

  - name: hero
    label: Hero
    type: group
    items:
      - name: en
        label: English
        type: file
        path: data/en/sections/hero.yml
        format: yaml
        fields: &heroFields
          - name: logo
            type: object
            fields:
              - { name: src, type: image, label: "Hero logo (dark theme)" }
              - { name: srcLight, type: image, label: "Hero logo (light theme)", required: false }
              - { name: alt, type: string }
              - { name: href, type: string, default: "/" }
          - { name: pills, type: string, list: true, label: "Pills (\"Budgeting\", \"Planning\", ...)" }
          - { name: tagline, type: string, label: "Eyebrow tagline (sits above the headline, terra-tinted)" }
          - name: headline
            label: Headline
            type: object
            fields:
              - { name: prefix, type: string, label: "Top line" }
              - { name: emphasis, type: string, label: "Emphasised middle line (renders inside <em>)" }
              - { name: suffix, type: string, label: "Bottom line (HTML allowed)" }
          - { name: paragraph, type: text, label: "Body paragraph" }
          - name: actions
            label: CTA buttons
            type: object
            list:
              collapsible:
                summary: "{label} ({style})"
            fields:
              - { name: label, type: string, required: true }
              - { name: href, type: string, required: true }
              - name: style
                type: select
                options:
                  values: [primary, secondary]
          - name: illustrations
            type: object
            fields:
              - name: background
                label: "Background SVG"
                type: object
                fields:
                  - { name: src, type: image }
                  - { name: alt, type: string }
              - name: foreground
                label: "Foreground SVG"
                type: object
                fields:
                  - { name: src, type: image }
                  - { name: alt, type: string }
      - name: da
        label: Dansk
        type: file
        path: data/da/sections/hero.yml
        format: yaml
        fields: *heroFields
      - name: hu
        label: Magyar
        type: file
        path: data/hu/sections/hero.yml
        format: yaml
        fields: *heroFields

  - name: video
    label: Video section
    type: group
    items:
      - name: en
        label: English
        type: file
        path: data/en/sections/video.yml
        format: yaml
        fields: &videoFields
          - { name: tag, type: string }
          - { name: headline, type: string }
          - { name: subtitle, type: text }
          - name: embed
            type: object
            fields:
              - name: provider
                type: select
                options:
                  values: [youtube]
              - { name: id, type: string, label: "Video ID (e.g. znk-ssXoI64)" }
              - { name: title, type: string, label: "Iframe title (a11y)" }
              - { name: params, type: string, label: "URL params (e.g. rel=0&modestbranding=1)" }
      - name: da
        label: Dansk
        type: file
        path: data/da/sections/video.yml
        format: yaml
        fields: *videoFields
      - name: hu
        label: Magyar
        type: file
        path: data/hu/sections/video.yml
        format: yaml
        fields: *videoFields

  - name: pain
    label: Pain / Problem section
    type: group
    items:
      - name: en
        label: English
        type: file
        path: data/en/sections/pain.yml
        format: yaml
        fields: &painFields
          - { name: tag, type: string }
          - name: headline
            type: object
            fields:
              - { name: primary, type: string, label: "First line" }
              - { name: emphasis, type: string, label: "Second line" }
          - { name: subtitle, type: text }
          - name: illustration
            type: object
            fields:
              - { name: src, type: image }
              - { name: alt, type: string }
          - name: badges
            label: Floating badges
            type: object
            list:
              collapsible:
                summary: "{label}: {value}"
            fields:
              - name: id
                type: select
                label: Badge slot
                options:
                  values: [b1, b2]
              - { name: label, type: string }
              - { name: value, type: string }
              - { name: trend, type: string }
              - name: trendVariant
                type: select
                required: false
                options:
                  values: [deadline]
          - name: cards
            label: Pain cards
            type: object
            list:
              collapsible:
                summary: "{icon} {title}"
            fields:
              - { name: icon, type: string, label: "Emoji or unicode icon" }
              - { name: title, type: string, required: true }
              - { name: body, type: text, required: true }
      - name: da
        label: Dansk
        type: file
        path: data/da/sections/pain.yml
        format: yaml
        fields: *painFields
      - name: hu
        label: Magyar
        type: file
        path: data/hu/sections/pain.yml
        format: yaml
        fields: *painFields

  - name: features
    label: Features section
    type: group
    items:
      - name: en
        label: English
        type: file
        path: data/en/sections/features.yml
        format: yaml
        fields: &featuresFields
          - name: intro
            label: Intro panel
            type: object
            fields:
              - { name: tag, type: string }
              - { name: headline, type: text, label: "Headline (newline = <br>)" }
              - { name: subtitle, type: text }
              - { name: iconGrid, type: image, list: true, label: "4 icon SVGs" }
              - name: illustration
                label: "Right-side illustration"
                type: object
                fields:
                  - { name: src, type: image }
                  - { name: alt, type: string }
          - name: panels
            label: Feature panels
            type: object
            list:
              collapsible:
                summary: "{id}"
            fields:
              - { name: id, type: string, label: "Slug (cashflow, tax, ...)" }
              - { name: title, type: text, label: "Title (newline = <br>)" }
              - { name: body, type: text, required: true }
              - name: maskIcon
                type: select
                label: "Mask icon (numeric ID, must match esio-iconNN.svg)"
                options:
                  values: ["01", "02", "03", "05"]
              - name: illustration
                type: object
                fields:
                  - { name: src, type: image }
                  - { name: alt, type: string }
              - { name: flipped, type: boolean, default: false, label: "Mirror illustration horizontally" }
      - name: da
        label: Dansk
        type: file
        path: data/da/sections/features.yml
        format: yaml
        fields: *featuresFields
      - name: hu
        label: Magyar
        type: file
        path: data/hu/sections/features.yml
        format: yaml
        fields: *featuresFields

  - name: pricing
    label: Pricing section
    type: group
    items:
      - name: en
        label: English
        type: file
        path: data/en/sections/pricing.yml
        format: yaml
        fields: &pricingFields
          - { name: tag, type: string }
          - { name: headline, type: string }
          - { name: subtitle, type: text }
          - name: billingToggle
            type: object
            fields:
              - { name: yearlyLabel, type: string }
              - { name: monthlyLabel, type: string }
              - { name: ariaLabel, type: string }
          - name: tiers
            label: Pricing tiers
            type: object
            list:
              collapsible:
                summary: "{name}"
            fields:
              - { name: id, type: string, required: true }
              - { name: name, type: string, required: true }
              - { name: currency, type: string, default: "DKK" }
              - { name: yearlyPrice, type: string, label: "Yearly price (digits only)" }
              - { name: monthlyPrice, type: string, label: "Monthly price (digits only)" }
              - { name: yearlyPeriod, type: string }
              - { name: monthlyPeriod, type: string }
              - { name: description, type: text }
              - { name: features, type: string, list: true, label: "Included features" }
              - name: cta
                type: object
                fields:
                  - { name: label, type: string }
                  - { name: href, type: string }
                  - name: style
                    type: select
                    options:
                      values: [ghost, featured]
              - { name: featured, type: boolean, default: false, label: "Highlight as the recommended tier" }
              - { name: badge, type: string, required: false, label: "Optional badge text (e.g. Most Popular)" }
      - name: da
        label: Dansk
        type: file
        path: data/da/sections/pricing.yml
        format: yaml
        fields: *pricingFields
      - name: hu
        label: Magyar
        type: file
        path: data/hu/sections/pricing.yml
        format: yaml
        fields: *pricingFields

  - name: subscribe
    label: Subscribe / Trial section
    type: group
    items:
      - name: en
        label: English
        type: file
        path: data/en/sections/subscribe.yml
        format: yaml
        fields: &subscribeFields
          - { name: tag, type: string }
          - name: headline
            type: object
            fields:
              - { name: prefix, type: string }
              - { name: suffix, type: string }
          - { name: body, type: text }
          - { name: benefits, type: string, list: true, label: "Benefit bullets" }
          - name: formBox
            type: object
            fields:
              - { name: title, type: string }
              - { name: subtitle, type: text, label: "Subtitle (newline = <br>)" }
              - name: cta
                type: object
                fields:
                  - { name: label, type: string }
                  - { name: href, type: string }
              - { name: legalNote, type: text }
      - name: da
        label: Dansk
        type: file
        path: data/da/sections/subscribe.yml
        format: yaml
        fields: *subscribeFields
      - name: hu
        label: Magyar
        type: file
        path: data/hu/sections/subscribe.yml
        format: yaml
        fields: *subscribeFields

  - name: footer
    label: Footer
    type: group
    items:
      - name: en
        label: English
        type: file
        path: data/en/sections/footer.yml
        format: yaml
        fields: &footerFields
          - { name: decorations, type: image, list: true, label: "6 decorative SVGs" }
          - name: brand
            type: object
            fields:
              - name: logo
                type: object
                fields:
                  - { name: src, type: image, label: "Logo (dark theme)" }
                  - { name: srcLight, type: image, label: "Logo (light theme)", required: false }
                  - { name: alt, type: string }
              - { name: tagline, type: text }
          - name: columns
            label: Footer columns
            type: object
            list:
              collapsible:
                summary: "{heading}"
            fields:
              - { name: heading, type: string, required: true }
              - name: links
                type: object
                list:
                  collapsible:
                    summary: "{label}"
                fields:
                  - { name: label, type: string, required: true }
                  - { name: href, type: string, required: true }
          - name: bottom
            type: object
            fields:
              - { name: copyright, type: string }
              - { name: tagline, type: string }
      - name: da
        label: Dansk
        type: file
        path: data/da/sections/footer.yml
        format: yaml
        fields: *footerFields
      - name: hu
        label: Magyar
        type: file
        path: data/hu/sections/footer.yml
        format: yaml
        fields: *footerFields

  # ────────────────────────────────────────────────────────────────────────
  # Markdown content collections — bilingual. Danish files are recognised by
  # the .da.md filename suffix; both languages live in the same collection
  # because Hugo's file-based i18n doesn't separate them by directory.
  # ────────────────────────────────────────────────────────────────────────
  - name: articles
    label: Articles
    type: collection
    path: content/articles
    filename: '{primary}.md'
    exclude: ['_index.md']
    format: yaml-frontmatter
    view:
      fields: [title, date, tags]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - { name: title, type: string, required: true }
      - { name: description, type: text, label: "Card / SEO description" }
      - { name: date, type: date, required: true }
      - { name: author, type: string }
      - { name: tags, type: string, list: true }
      - { name: image, type: image, media: share, label: "Social-share image (1200x630, optional — falls back to site default)", required: false }
      - { name: body, type: rich-text, label: Article body }

  - name: posts
    label: Blog posts
    type: collection
    path: content/posts
    filename: '{primary}.md'
    exclude: ['_index.md']
    format: yaml-frontmatter
    view:
      fields: [title, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - { name: title, type: string, required: true }
      - { name: description, type: text, label: "Card / SEO description" }
      - { name: date, type: date, required: true }
      - { name: image, type: image, media: share, label: "Social-share image (1200x630, optional — falls back to site default)", required: false }
      - { name: body, type: rich-text, label: Post body }

  - name: legal
    label: Legal documents
    type: collection
    path: content/legal
    filename: '{primary}.md'
    exclude: ['_index.md']
    format: yaml-frontmatter
    view:
      fields: [title, weight]
      primary: title
      sort: [weight, title]
      default:
        sort: weight
        order: asc
    fields:
      - { name: title, type: string, required: true }
      - { name: description, type: text }
      - { name: date, type: date, label: "Last reviewed" }
      - { name: weight, type: number, default: 99, label: "Sort order (1 = first)" }
      - { name: body, type: rich-text, label: Document body }
