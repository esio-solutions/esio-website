# ──────────────────────────────────────────────────────────────────────────────
# Pages CMS configuration
#   https://pagescms.org/docs/configuration/
#
# This config is the interface contract between the repo and editors using
# pagescms.org. It describes:
#   - where uploaded media lands (static/assets/ + share-cards subfolder)
#   - the homepage section data (split per-section under data/<lang>/index/<section>/)
#   - the three markdown content collections (articles, posts, legal)
#
# Data layout (since the index-folder refactor):
#   data/<lang>/index/<section>/meta.yml         — section header (tag, headline, …)
#   data/<lang>/index/<section>/<sub>/<N>-*.yml  — split-out list items (tiers,
#                                                  panels, cards, members, …),
#                                                  ordered alphabetically by
#                                                  filename. Hugo's range over a
#                                                  data folder iterates by key.
#   data/<lang>/index/how/                       — special-case: step files live
#                                                  alongside meta.yml (no sub-folder),
#                                                  so the steps collection excludes
#                                                  meta.yml below.
#
# Sidebar layout mirrors the homepage flow — Navigation at the top, Footer at
# the bottom. Each section is a `type: group` containing the header file(s) and
# any collection(s) of list items, with EN/DA split inside the group so an
# editor first picks WHAT to edit and then the language.
#
# Field schemas use YAML anchors (&navHeader, &tierFields, …) so editing the EN
# entry cascades to DA/HU via *alias.
#
# Editing this file changes what editors see and how the form looks. It does
# NOT change the data model — that lives in data/<lang>/index/<section>/ and
# the markdown front-matter. Keep this config in sync with those.
# ──────────────────────────────────────────────────────────────────────────────

media:
  # Each named bucket below maps to a sub-folder of static/assets/. Splitting
  # them out gives editors a clearer "where does this belong" picker in the
  # CMS uploader instead of one flat folder containing every kind of file.
  - name: illustrations
    label: Section illustrations (graphic — charts, UI mocks, abstract scenes)
    input: static/assets/illustrations
    output: /assets/illustrations
    extensions: [svg, png, jpg, jpeg, webp]
  - name: characters
    label: Character illustrations (figures of people — kept separate so they
      can be excluded from the theme-templating pass)
    input: static/assets/characters
    output: /assets/characters
    extensions: [svg, png, jpg, jpeg, webp]
  - name: logos
    label: Logos (brand wordmarks, square marks, favicons)
    input: static/assets/logos
    output: /assets/logos
    extensions: [svg, png, jpg, jpeg, webp, ico]
  - name: share
    label: Social-share cards (per-post 1200x630 OG images + source artwork)
    input: static/assets/share
    output: /assets/share
    extensions: [svg, jpg, jpeg, png, webp]
  # Catch-all kept last so editors can still reach anything stray under
  # static/assets/ that doesn't fit the buckets above (e.g. team/).
  - name: assets
    label: Other assets (catch-all under static/assets/)
    input: static/assets
    output: /assets
    extensions: [svg, png, jpg, jpeg, webp, ico]

content:
  # ────────────────────────────────────────────────────────────────────────
  # Site-wide settings — single file, no language variants
  # ────────────────────────────────────────────────────────────────────────
  - name: site_seo
    label: Site SEO defaults
    type: file
    path: hugo.toml
    format: toml
    fields:
      - name: params
        type: object
        fields:
          - { name: ogImage, type: image, label: "Default social-share image (1200x630, used when a page has no image of its own)" }

  # ────────────────────────────────────────────────────────────────────────
  # Homepage metadata — <title> and <meta description> for the home page.
  # Each page section (nav, hero, …) is a separate group below; this one
  # covers the page-level SEO that wraps the whole homepage.
  # ────────────────────────────────────────────────────────────────────────
  - name: home
    label: Homepage metadata
    type: group
    items:
      - name: en
        label: English
        type: file
        path: content/_index.md
        format: yaml-frontmatter
        fields: &homeFields
          - { name: title, label: Page title, type: string, required: true, default: "ESIO" }
          - { name: description, label: Meta description, type: text }
      - name: da
        label: Dansk
        type: file
        path: content/_index.da.md
        format: yaml-frontmatter
        fields: *homeFields

  # ────────────────────────────────────────────────────────────────────────
  # About page — standalone Markdown content at /about/.
  # ────────────────────────────────────────────────────────────────────────
  - name: about
    label: About page
    type: group
    items:
      - name: en
        label: English
        type: file
        path: content/about.md
        format: yaml-frontmatter
        fields: &aboutFields
          - { name: title, type: string, required: true, default: "About ESIO" }
          - { name: description, type: text, label: "Meta description" }
          - { name: date, type: date, required: true, label: "Last reviewed" }
          - { name: body, type: rich-text, label: "Body" }
      - name: da
        label: Dansk
        type: file
        path: content/about.da.md
        format: yaml-frontmatter
        fields: *aboutFields

  # ────────────────────────────────────────────────────────────────────────
  # Contact page — standalone Markdown content at /contact/.
  # ────────────────────────────────────────────────────────────────────────
  - name: contact
    label: Contact page
    type: group
    items:
      - name: en
        label: English
        type: file
        path: content/contact.md
        format: yaml-frontmatter
        fields: &contactFields
          - { name: title, type: string, required: true, default: "Contact" }
          - { name: description, type: text, label: "Meta description" }
          - { name: date, type: date, required: true, label: "Last reviewed" }
          - { name: body, type: rich-text, label: "Body" }
      - name: da
        label: Dansk
        type: file
        path: content/contact.da.md
        format: yaml-frontmatter
        fields: *contactFields

  # ────────────────────────────────────────────────────────────────────────
  # Team section — renders at the bottom of the About page. The intro block
  # plus a collection of member cards. Member files are ordered by filename
  # (e.g. 01-elod.yml before 02-iustinian.yml).
  # ────────────────────────────────────────────────────────────────────────
  - name: team
    label: Team section
    type: group
    items:
      - name: intro-en
        label: "Intro (English)"
        type: file
        path: data/en/index/team/intro.yml
        format: yaml
        fields: &teamIntroFields
          - { name: tag, type: string, label: "Eyebrow tag (small uppercase)" }
          - { name: headline, type: string }
          - { name: body, type: text }
          - name: cta
            label: "Closing CTA"
            type: object
            fields:
              - { name: text, type: string, label: "Lead-in line above the link" }
              - { name: link_label, type: string }
              - { name: link_href, type: string, label: "Link target (mailto:, /contact/, etc.)" }
      - name: intro-da
        label: "Intro (Dansk)"
        type: file
        path: data/da/index/team/intro.yml
        format: yaml
        fields: *teamIntroFields
      - name: members-en
        label: "Members (English)"
        type: collection
        path: data/en/index/team/members
        filename: '{primary}.yml'
        format: yaml
        view:
          primary: name
          fields: [name, role]
          sort: [name]
        fields: &teamMemberFields
          - { name: name, type: string, required: true }
          - { name: role, type: string }
          - { name: photo, type: image, required: false, label: "Photo (square; falls back to initials when empty)" }
          - { name: bio, type: text }
          - { name: quote, type: string, required: false, label: "Optional pull quote" }
      - name: members-da
        label: "Members (Dansk)"
        type: collection
        path: data/da/index/team/members
        filename: '{primary}.yml'
        format: yaml
        view:
          primary: name
          fields: [name, role]
          sort: [name]
        fields: *teamMemberFields

  # ════════════════════════════════════════════════════════════════════════
  # Homepage sections — listed in the order they render on the homepage.
  # Each section is one top-level group containing a header file (meta.yml
  # or intro.yml) and any list-collection sub-folders, with per-language
  # entries inside each.
  # ════════════════════════════════════════════════════════════════════════

  - name: nav
    label: Navigation
    type: group
    items:
      - name: header-en
        label: "Header (English)"
        type: file
        path: data/en/index/nav/meta.yml
        format: yaml
        fields: &navHeaderFields
          - name: logo
            type: object
            fields:
              - { name: src, type: image, label: "Logo (dark theme — usually white-on-transparent)" }
              - { name: srcLight, type: image, label: "Logo (light theme — usually navy-on-transparent)", required: false }
              - { name: alt, type: string, label: Alt text }
              - { name: href, type: string, label: Link target, default: "/" }
      - name: header-da
        label: "Header (Dansk)"
        type: file
        path: data/da/index/nav/meta.yml
        format: yaml
        fields: *navHeaderFields
      - name: links-en
        label: "Top-bar links (English)"
        type: collection
        path: data/en/index/nav/links
        filename: '{primary}.yml'
        format: yaml
        view:
          primary: label
          fields: [label, href]
        fields: &navLinkFields
          - { name: label, type: string, required: true }
          - { name: href, type: string, required: true }
      - name: links-da
        label: "Top-bar links (Dansk)"
        type: collection
        path: data/da/index/nav/links
        filename: '{primary}.yml'
        format: yaml
        view:
          primary: label
          fields: [label, href]
        fields: *navLinkFields
      - name: actions-en
        label: "Right-side buttons (English)"
        type: collection
        path: data/en/index/nav/actions
        filename: '{primary}.yml'
        format: yaml
        view:
          primary: label
          fields: [label, style]
        fields: &navActionFields
          - { name: label, type: string, required: true }
          - { name: href, type: string, required: true }
          - { name: event, type: string, required: false, label: "Umami event name (analytics)" }
          - name: style
            type: select
            options:
              values: [primary, secondary]
      - name: actions-da
        label: "Right-side buttons (Dansk)"
        type: collection
        path: data/da/index/nav/actions
        filename: '{primary}.yml'
        format: yaml
        view:
          primary: label
          fields: [label, style]
        fields: *navActionFields

  - name: hero
    label: Hero
    type: group
    items:
      - name: en
        label: English
        type: file
        path: data/en/index/hero/meta.yml
        format: yaml
        fields: &heroFields
          - name: logo
            type: object
            fields:
              - { name: src, type: image, label: "Hero logo (dark theme)" }
              - { name: srcLight, type: image, label: "Hero logo (light theme)", required: false }
              - { name: alt, type: string }
              - { name: href, type: string, default: "/" }
          - { name: pills, type: string, list: true, label: "Pills (\"Budgeting\", \"Planning\", ...)" }
          - { name: tagline, type: string, label: "Eyebrow tagline (sits above the headline, terra-tinted)" }
          - name: headline
            label: Headline
            type: object
            fields:
              - { name: prefix, type: string, label: "Top line" }
              - { name: emphasis, type: string, label: "Emphasised middle line (renders inside <em>)" }
              - { name: suffix, type: string, label: "Bottom line (HTML allowed)" }
          - { name: paragraph, type: text, label: "Body paragraph" }
          - name: actions
            label: CTA buttons
            type: object
            list:
              collapsible:
                summary: "{label} ({style})"
            fields:
              - { name: label, type: string, required: true }
              - { name: href, type: string, required: true }
              - name: style
                type: select
                options:
                  values: [primary, secondary]
          - name: illustrations
            type: object
            fields:
              - name: background
                label: "Background SVG"
                type: object
                fields:
                  - { name: src, type: image }
                  - { name: alt, type: string }
              - name: foreground
                label: "Foreground SVG"
                type: object
                fields:
                  - { name: src, type: image }
                  - { name: alt, type: string }
      - name: da
        label: Dansk
        type: file
        path: data/da/index/hero/meta.yml
        format: yaml
        fields: *heroFields

  # ──────────────────────────────────────────────────────────────────────
  # Video section — currently commented out of home.html in favour of the
  # How-it-works section. Kept in CMS so the data can still be edited while
  # the panel is dark; uncomment {{ partial "sections/video.html" . }} in
  # themes/esio-theme/layouts/home.html to bring it back.
  # ──────────────────────────────────────────────────────────────────────
  - name: video
    label: Video section (currently disabled on home)
    type: group
    items:
      - name: en
        label: English
        type: file
        path: data/en/index/video/meta.yml
        format: yaml
        fields: &videoFields
          - { name: tag, type: string }
          - { name: headline, type: string }
          - { name: subtitle, type: text }
          - name: embed
            type: object
            fields:
              - name: provider
                type: select
                options:
                  values: [youtube]
              - { name: id, type: string, label: "Video ID (e.g. znk-ssXoI64)" }
              - { name: title, type: string, label: "Iframe title (a11y)" }
              - { name: params, type: string, label: "URL params (e.g. rel=0&modestbranding=1)" }
      - name: da
        label: Dansk
        type: file
        path: data/da/index/video/meta.yml
        format: yaml
        fields: *videoFields

  # ──────────────────────────────────────────────────────────────────────
  # How it works — section header + N step cards. Steps live directly
  # alongside meta.yml inside how/ (not under a sub-folder), so the steps
  # collection excludes meta.yml.
  # ──────────────────────────────────────────────────────────────────────
  - name: how
    label: How it works
    type: group
    items:
      - name: header-en
        label: "Header (English)"
        type: file
        path: data/en/index/how/meta.yml
        format: yaml
        fields: &howHeaderFields
          - { name: tag, type: string }
          - { name: headline, type: string }
          - { name: subtitle, type: text }
      - name: header-da
        label: "Header (Dansk)"
        type: file
        path: data/da/index/how/meta.yml
        format: yaml
        fields: *howHeaderFields
      - name: steps-en
        label: "Steps (English)"
        type: collection
        path: data/en/index/how
        filename: '{primary}.yml'
        format: yaml
        exclude: ['meta.yml']
        view:
          primary: title
          fields: [title]
        fields: &howStepFields
          - { name: icon, type: image, label: "Illustration SVG (under /assets/illustrations/how/)" }
          - { name: title, type: string, required: true }
          - { name: body, type: string, list: true, label: "Bullet body (one line per bullet)" }
      - name: steps-da
        label: "Steps (Dansk)"
        type: collection
        path: data/da/index/how
        filename: '{primary}.yml'
        format: yaml
        exclude: ['meta.yml']
        view:
          primary: title
          fields: [title]
        fields: *howStepFields

  - name: pain
    label: Pain / Problem section
    type: group
    items:
      - name: header-en
        label: "Header (English)"
        type: file
        path: data/en/index/pain/meta.yml
        format: yaml
        fields: &painHeaderFields
          - { name: tag, type: string }
          - name: headline
            type: object
            fields:
              - { name: primary, type: string, label: "First line" }
              - { name: emphasis, type: string, label: "Second line" }
          - { name: subtitle, type: text }
          - name: illustration
            type: object
            fields:
              - { name: src, type: image }
              - { name: alt, type: string }
      - name: header-da
        label: "Header (Dansk)"
        type: file
        path: data/da/index/pain/meta.yml
        format: yaml
        fields: *painHeaderFields
      - name: cards-en
        label: "Pain cards (English)"
        type: collection
        path: data/en/index/pain/cards
        filename: '{primary}.yml'
        format: yaml
        view:
          primary: title
          fields: [title]
        fields: &painCardFields
          - { name: icon, type: string, label: "Emoji or unicode icon" }
          - { name: title, type: string, required: true }
          - { name: body, type: text, required: true }
      - name: cards-da
        label: "Pain cards (Dansk)"
        type: collection
        path: data/da/index/pain/cards
        filename: '{primary}.yml'
        format: yaml
        view:
          primary: title
          fields: [title]
        fields: *painCardFields
      - name: badges-en
        label: "Floating badges (English)"
        type: collection
        path: data/en/index/pain/badges
        filename: '{primary}.yml'
        format: yaml
        view:
          primary: label
          fields: [label, value]
        fields: &painBadgeFields
          - name: id
            type: select
            label: Badge slot
            options:
              values: [b1, b2]
          - { name: label, type: string }
          - { name: value, type: string }
          - { name: trend, type: string }
          - name: trendVariant
            type: select
            required: false
            options:
              values: [deadline]
      - name: badges-da
        label: "Floating badges (Dansk)"
        type: collection
        path: data/da/index/pain/badges
        filename: '{primary}.yml'
        format: yaml
        view:
          primary: label
          fields: [label, value]
        fields: *painBadgeFields

  - name: features
    label: Features section
    type: group
    items:
      - name: intro-en
        label: "Intro panel (English)"
        type: file
        path: data/en/index/features/intro.yml
        format: yaml
        fields: &featuresIntroFields
          - { name: tag, type: string }
          - { name: headline, type: text, label: "Headline (newline = <br>)" }
          - { name: subtitle, type: text }
          - { name: iconGrid, type: string, list: true, label: "4 Material Symbols icon names (e.g. currency_exchange)" }
          - name: illustration
            label: "Right-side illustration"
            type: object
            fields:
              - { name: src, type: image }
              - { name: alt, type: string }
      - name: intro-da
        label: "Intro panel (Dansk)"
        type: file
        path: data/da/index/features/intro.yml
        format: yaml
        fields: *featuresIntroFields
      - name: panels-en
        label: "Feature panels (English)"
        type: collection
        path: data/en/index/features/panels
        filename: '{primary}.yml'
        format: yaml
        view:
          primary: id
          fields: [id, title]
        fields: &featuresPanelFields
          - { name: id, type: string, label: "Slug (cashflow, tax, ...)" }
          - { name: title, type: text, label: "Title (newline = <br>)" }
          - { name: body, type: text, required: true }
          - { name: icon, type: string, label: "Material Symbols icon name (e.g. currency_exchange)" }
          - name: illustration
            type: object
            fields:
              - { name: src, type: image }
              - { name: alt, type: string }
          - { name: flipped, type: boolean, default: false, label: "Mirror illustration horizontally" }
      - name: panels-da
        label: "Feature panels (Dansk)"
        type: collection
        path: data/da/index/features/panels
        filename: '{primary}.yml'
        format: yaml
        view:
          primary: id
          fields: [id, title]
        fields: *featuresPanelFields

  - name: pricing
    label: Pricing section
    type: group
    items:
      - name: header-en
        label: "Header (English)"
        type: file
        path: data/en/index/pricing/meta.yml
        format: yaml
        fields: &pricingHeaderFields
          - { name: tag, type: string }
          - { name: headline, type: string }
          - { name: subtitle, type: text }
          - name: billingToggle
            type: object
            fields:
              - { name: yearlyLabel, type: string }
              - { name: monthlyLabel, type: string }
              - { name: ariaLabel, type: string }
      - name: header-da
        label: "Header (Dansk)"
        type: file
        path: data/da/index/pricing/meta.yml
        format: yaml
        fields: *pricingHeaderFields
      - name: tiers-en
        label: "Tiers (English)"
        type: collection
        path: data/en/index/pricing/tiers
        filename: '{primary}.yml'
        format: yaml
        view:
          primary: name
          fields: [name, featured]
        fields: &pricingTierFields
          - { name: id, type: string, required: true }
          - { name: name, type: string, required: true }
          - { name: currency, type: string, default: "DKK" }
          - { name: yearlyPrice, type: string, label: "Yearly price (digits only)" }
          - { name: monthlyPrice, type: string, label: "Monthly price (digits only)" }
          - { name: yearlyPeriod, type: string }
          - { name: monthlyPeriod, type: string }
          - { name: description, type: text }
          - { name: features, type: string, list: true, label: "Included features" }
          - name: cta
            type: object
            fields:
              - { name: label, type: string }
              - { name: href, type: string }
              - { name: event, type: string, required: false, label: "Umami event name (analytics)" }
              - name: style
                type: select
                options:
                  values: [ghost, featured]
          - { name: featured, type: boolean, default: false, label: "Highlight as the recommended tier" }
          - { name: badge, type: string, required: false, label: "Optional badge text (e.g. Most Popular)" }
      - name: tiers-da
        label: "Tiers (Dansk)"
        type: collection
        path: data/da/index/pricing/tiers
        filename: '{primary}.yml'
        format: yaml
        view:
          primary: name
          fields: [name, featured]
        fields: *pricingTierFields

  - name: subscribe
    label: Subscribe / Trial section
    type: group
    items:
      - name: en
        label: English
        type: file
        path: data/en/index/subscribe/meta.yml
        format: yaml
        fields: &subscribeFields
          - { name: tag, type: string }
          - name: headline
            type: object
            fields:
              - { name: prefix, type: string }
              - { name: suffix, type: string }
          - { name: body, type: text }
          - { name: benefits, type: string, list: true, label: "Benefit bullets" }
          - name: formBox
            type: object
            fields:
              - { name: title, type: string }
              - { name: subtitle, type: text, label: "Subtitle (newline = <br>)" }
              - name: cta
                type: object
                fields:
                  - { name: label, type: string }
                  - { name: href, type: string }
                  - { name: event, type: string, required: false, label: "Umami event name (analytics)" }
              - { name: legalNote, type: text }
      - name: da
        label: Dansk
        type: file
        path: data/da/index/subscribe/meta.yml
        format: yaml
        fields: *subscribeFields

  # ──────────────────────────────────────────────────────────────────────
  # Newsletter page metadata — <title>/<meta description> for /newsletter/.
  # Mirrors the home/about/contact page-metadata groups; the editable section
  # content lives in the `newsletter` group below.
  # ──────────────────────────────────────────────────────────────────────
  - name: newsletter_page
    label: Newsletter page metadata
    type: group
    items:
      - name: en
        label: English
        type: file
        path: content/newsletter.md
        format: yaml-frontmatter
        fields: &newsletterPageFields
          - { name: title, label: Page title, type: string, required: true, default: "Newsletter" }
          - { name: description, label: Meta description, type: text }
      - name: da
        label: Dansk
        type: file
        path: content/newsletter.da.md
        format: yaml-frontmatter
        fields: *newsletterPageFields

  # ──────────────────────────────────────────────────────────────────────
  # Newsletter page section — appears on /newsletter/, not the home page.
  # ──────────────────────────────────────────────────────────────────────
  - name: newsletter
    label: Newsletter page section
    type: group
    items:
      - name: en
        label: English
        type: file
        path: data/en/index/newsletter/meta.yml
        format: yaml
        fields: &newsletterFields
          - { name: tag, type: string }
          - { name: headline, type: string }
          - { name: subtitle, type: text }
          - name: fields
            type: object
            fields:
              - name: name
                type: object
                fields:
                  - { name: label, type: string }
                  - { name: placeholder, type: string }
              - name: email
                type: object
                fields:
                  - { name: label, type: string }
                  - { name: placeholder, type: string }
          - name: cta
            type: object
            fields:
              - { name: label, type: string }
          - { name: legalNote, type: text }
          - name: fallback
            label: "Fallback (when no listUuid configured)"
            type: object
            fields:
              - { name: body, type: text }
              - { name: cta, type: string }
          - name: status
            label: "Inline status messages"
            type: object
            fields:
              - { name: submitting, type: text }
              - { name: success, type: text }
              - { name: errorGeneric, type: text }
              - { name: errorNetwork, type: text }
              - { name: waitingForCaptcha, type: text }
      - name: da
        label: Dansk
        type: file
        path: data/da/index/newsletter/meta.yml
        format: yaml
        fields: *newsletterFields

  # ──────────────────────────────────────────────────────────────────────
  # Tutorials page — standalone page at /tutorials/ (layout: tutorials).
  # Page metadata (title/description) plus the section header and three
  # data collections: categories (which order + group the entries),
  # features (single-video walkthroughs) and reels (multi-shot run-throughs).
  # A category's `entries` reference features/reels by their filename stem.
  # ──────────────────────────────────────────────────────────────────────
  - name: tutorials
    label: Tutorials page
    type: group
    items:
      - name: page-en
        label: "Page metadata (English)"
        type: file
        path: content/tutorials.md
        format: yaml-frontmatter
        fields: &tutorialsPageFields
          - { name: title, type: string, required: true, default: "Tutorials" }
          - { name: description, type: text, label: "Meta description" }
          - { name: date, type: date, required: true, label: "Last reviewed" }
      - name: page-da
        label: "Page metadata (Dansk)"
        type: file
        path: content/tutorials.da.md
        format: yaml-frontmatter
        fields: *tutorialsPageFields
      - name: header-en
        label: "Header (English)"
        type: file
        path: data/en/tutorials/meta.yml
        format: yaml
        fields: &tutorialsHeaderFields
          - { name: tag, type: string, label: "Eyebrow tag (small uppercase)" }
          - { name: headline, type: string }
          - { name: subtitle, type: text }
      - name: header-da
        label: "Header (Dansk)"
        type: file
        path: data/da/tutorials/meta.yml
        format: yaml
        fields: *tutorialsHeaderFields
      - name: categories-en
        label: "Categories (English)"
        type: collection
        path: data/en/tutorials/categories
        filename: '{primary}.yml'
        format: yaml
        view:
          primary: title
          fields: [id, title]
        fields: &tutorialsCategoryFields
          - { name: id, type: string, required: true, label: "Slug (getting-started, ...)" }
          - { name: title, type: string, required: true }
          - { name: blurb, type: text }
          - name: entries
            label: "Entries (ordered references into Features / Reels)"
            type: object
            list:
              collapsible:
                summary: "{kind}: {ref}"
            fields:
              - name: kind
                type: select
                options:
                  values: [feature, reel]
              - { name: ref, type: string, label: "Filename stem of the feature/reel (e.g. 01-sign-in)" }
      - name: categories-da
        label: "Categories (Dansk)"
        type: collection
        path: data/da/tutorials/categories
        filename: '{primary}.yml'
        format: yaml
        view:
          primary: title
          fields: [id, title]
        fields: *tutorialsCategoryFields
      - name: features-en
        label: "Features — single-video walkthroughs (English)"
        type: collection
        path: data/en/tutorials/features
        filename: '{primary}.yml'
        format: yaml
        view:
          primary: title
          fields: [id, title, duration]
        fields: &tutorialsFeatureFields
          - { name: id, type: string, required: true, label: "Slug (sign-in, ...)" }
          - { name: title, type: string, required: true }
          - { name: duration, type: string, label: "Run time (e.g. 0:25)" }
          - { name: lead, type: text }
          - { name: bullets, type: string, list: true, label: "Bullet points (one line each)" }
          - name: video
            type: object
            fields:
              - { name: webm, type: string, label: "Video path (under /videos/tutorials/)" }
              - { name: alt, type: string, label: "Description (a11y)" }
      - name: features-da
        label: "Features — single-video walkthroughs (Dansk)"
        type: collection
        path: data/da/tutorials/features
        filename: '{primary}.yml'
        format: yaml
        view:
          primary: title
          fields: [id, title, duration]
        fields: *tutorialsFeatureFields
      - name: reels-en
        label: "Reels — multi-shot run-throughs (English)"
        type: collection
        path: data/en/tutorials/reels
        filename: '{primary}.yml'
        format: yaml
        view:
          primary: title
          fields: [id, title, duration]
        fields: &tutorialsReelFields
          - { name: id, type: string, required: true, label: "Slug (empty-to-dashboard, ...)" }
          - { name: title, type: string, required: true }
          - { name: duration, type: string, label: "Run time (e.g. 0:42)" }
          - { name: lead, type: text }
          - name: masterVideo
            label: "Full reel (one continuous video)"
            type: object
            fields:
              - { name: webm, type: string, label: "Video path (under /videos/tutorials/reels/)" }
              - { name: alt, type: string, label: "Description (a11y)" }
          - name: shots
            label: "Shots (per-step clips with captions)"
            type: object
            list:
              collapsible:
                summary: "Shot {index}"
            fields:
              - { name: index, type: number, required: true, label: "Order (1, 2, 3, ...)" }
              - { name: caption, type: text }
              - name: clip
                type: object
                fields:
                  - { name: webm, type: string, label: "Clip path (under /videos/tutorials/reels/<slug>/)" }
                  - { name: alt, type: string, label: "Description (a11y)" }
      - name: reels-da
        label: "Reels — multi-shot run-throughs (Dansk)"
        type: collection
        path: data/da/tutorials/reels
        filename: '{primary}.yml'
        format: yaml
        view:
          primary: title
          fields: [id, title, duration]
        fields: *tutorialsReelFields

  - name: footer
    label: Footer
    type: group
    items:
      - name: header-en
        label: "Brand & bottom strip (English)"
        type: file
        path: data/en/index/footer/meta.yml
        format: yaml
        fields: &footerHeaderFields
          - { name: decorations, type: image, list: true, label: "6 decorative SVGs" }
          - name: brand
            type: object
            fields:
              - name: logo
                type: object
                fields:
                  - { name: src, type: image, label: "Logo (dark theme)" }
                  - { name: srcLight, type: image, label: "Logo (light theme)", required: false }
                  - { name: alt, type: string }
              - { name: tagline, type: text }
          - name: bottom
            type: object
            fields:
              - { name: copyright, type: string }
              - { name: tagline, type: string }
      - name: header-da
        label: "Brand & bottom strip (Dansk)"
        type: file
        path: data/da/index/footer/meta.yml
        format: yaml
        fields: *footerHeaderFields
      - name: columns-en
        label: "Footer columns (English)"
        type: collection
        path: data/en/index/footer/columns
        filename: '{primary}.yml'
        format: yaml
        view:
          primary: heading
          fields: [heading]
        fields: &footerColumnFields
          - { name: heading, type: string, required: true }
          - name: links
            type: object
            list:
              collapsible:
                summary: "{label}"
            fields:
              - { name: label, type: string, required: true }
              - { name: href, type: string, required: true }
              - { name: event, type: string, required: false, label: "Umami event name (analytics)" }
      - name: columns-da
        label: "Footer columns (Dansk)"
        type: collection
        path: data/da/index/footer/columns
        filename: '{primary}.yml'
        format: yaml
        view:
          primary: heading
          fields: [heading]
        fields: *footerColumnFields

  # ────────────────────────────────────────────────────────────────────────
  # Markdown content collections — bilingual. Danish files are recognised by
  # the .da.md filename suffix; both languages live in the same collection
  # because Hugo's file-based i18n doesn't separate them by directory.
  # ────────────────────────────────────────────────────────────────────────
  - name: articles
    label: Articles
    type: collection
    path: content/articles
    filename: '{primary}.md'
    exclude: ['_index.md']
    format: yaml-frontmatter
    view:
      fields: [title, date, tags]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - { name: title, type: string, required: true }
      - { name: description, type: text, label: "Card / SEO description" }
      - { name: date, type: date, required: true }
      - { name: author, type: string }
      - { name: tags, type: string, list: true }
      - { name: image, type: image, media: share, label: "Social-share image (1200x630, optional — falls back to site default)", required: false }
      - { name: body, type: rich-text, label: Article body }

  - name: posts
    label: Blog posts
    type: collection
    path: content/posts
    filename: '{primary}.md'
    exclude: ['_index.md']
    format: yaml-frontmatter
    view:
      fields: [title, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - { name: title, type: string, required: true }
      - { name: description, type: text, label: "Card / SEO description" }
      - { name: date, type: date, required: true }
      - { name: image, type: image, media: share, label: "Social-share image (1200x630, optional — falls back to site default)", required: false }
      - { name: body, type: rich-text, label: Post body }

  - name: legal
    label: Legal documents
    type: collection
    path: content/legal
    filename: '{primary}.md'
    exclude: ['_index.md']
    format: yaml-frontmatter
    view:
      fields: [title, weight]
      primary: title
      sort: [weight, title]
      default:
        sort: weight
        order: asc
    fields:
      - { name: title, type: string, required: true }
      - { name: description, type: text }
      - { name: date, type: date, label: "Last reviewed" }
      - { name: weight, type: number, default: 99, label: "Sort order (1 = first)" }
      - { name: body, type: rich-text, label: Document body }
