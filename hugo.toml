    [params.theme."sunrise-glow"]
      colorScheme          = "dark"
      label                = "theme_sunrise_glow"
      surface              = "sgCharcoal"
      surfaceDim           = "sgCharcoal"
      surfaceContainerHigh = "sgSeagrass"
      onSurface            = "white"
      primary              = "sgPumpkin"
      primaryContainer     = "sgPollen"
      onPrimary            = "white"
