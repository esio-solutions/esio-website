baseURL = "https://esio.dk/"
title = "ESIO"
theme = "esio-theme"
defaultContentLanguage = "en"
enableRobotsTXT = true
enableGitInfo = true
enableEmoji = true

# Microsoft Clarity. Fill `id` with your Clarity Project ID (a short string from
# clarity.microsoft.com → Settings → Setup). Loaded via Klaro consent (see
# themes/esio-theme/layouts/_partials/head/consent.html). Leaving `id` empty
# disables Clarity entirely; the consent banner still renders.
[params.clarity]
  id = "wlre5xyz6c"

# Umami self-hosted analytics. Cookieless, first-party — no consent required
# under the CNIL/EDPB audience-measurement exemption (Datatilsynet follows).
# Loaded unconditionally via themes/esio-theme/layouts/_partials/head/tracking.html.
# Get the UUID from analytics.esio.dk (Settings → Websites → Add → copy "Website ID").
# Empty websiteId = partial emits nothing.
[params.umami]
  websiteId = "b19c9f98-890b-4325-91be-1d39f3080369"

# Self-hosted Listmonk newsletter. The /newsletter/ page POSTs directly to
# the public subscribe endpoint. Get listUuid from analytics.esio.dk's admin
# at Settings → Lists → click the target list → "UUID" field at the top.
[params.newsletter]
  endpoint  = "https://newsletter.esio.dk/subscription/form"
  listUuid  = "0c9b3c13-a789-480b-a365-120feca25898"   # paste from Listmonk admin; empty value disables the form

# Altcha Sentinel captcha server (ghcr.io/altcha-org/sentinel). Hosted on
# captcha.esio.dk by the monitoring stack. Sentinel's /v1/challenge requires
# a per-form API key — get it from Sentinel admin → Forms → create a form →
# copy "API key" from the form's detail page. The widget appends it as
# ?apiKey=<key> automatically when apiKey is set below.
[params.captcha]
  challengeUrl = "https://captcha.esio.dk/v1/challenge"
  verifyUrl    = "https://captcha.esio.dk/v1/verify"   # tells widget to parse Sentinel-shape (nested) challenge
  apiKey       = "key_1jop5nvpf00c2v5ej5p"   # paste from Sentinel admin; empty disables the widget

# Each language gets a `/lang/` URL prefix for non-default languages and lives
# at the root for the default. Section data lives under data/<lang>/sections/.
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[languages]
  [languages.en]
    locale = "en-us"
    label = "English"
    weight = 1
    [languages.en.params]
      # Short tagline — used in <title>, og:description fallback, JSON-LD
      # description fallback. Per-page front-matter `description:` overrides
      # this for <meta description> on individual pages.
      description = "Budgeting Software for Small Business & Startups"

  [languages.da]
    locale = "da-dk"
    label = "Dansk"
    weight = 2
    [languages.da.params]
      description = "Budgetsoftware til små virksomheder & iværksættere"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

[build]
  writeStats = true

# ──────────────────────────────────────────────────────────────────────────────
# Site params
#   All design tokens live here. Editing a value below changes the rendered
#   site after `hugo` rebuilds. Templates must NEVER hardcode these values.
# ──────────────────────────────────────────────────────────────────────────────
[params]
  # description lives under [languages.<lang>.params] above so each language
  # gets its own tagline. Don't set it here — that would override the
  # per-language values via Hugo's params merge order.
  platformUrl = "https://budget.esio.dk/Login"

  # CVR (Centrale Virksomhedsregister) — Danish business registration number.
  # Surfaced via the {{< cvr >}} shortcode on contact / legal pages so this
  # value lives in exactly one place.
  cvr = "12345678"

  # Default Open Graph / Twitter Card image. Used on every page that doesn't
  # set its own `image:` or `cover:` in front-matter. Should be 1200x630
  # (1.91:1) so social platforms render the "large summary" card. Drop the
  # file at static/assets/og-default.jpg (or change the path here).
  ogImage = "/assets/og-default.jpg"

  # Optional. If set, emits twitter:site and twitter:creator meta tags.
  # twitterHandle = "@esio_dk"

  [params.colors]
    navy            = "#1B2B6B"
    navyDark        = "#111E4A"
    navyMid         = "#243580"
    purple          = "#6B5B9E"
    terra           = "#E07B5B"
    terraDark       = "#C46340"
    terraLight      = "#F09070"
    terraPale       = "#FAE8DF"
    teal            = "#4DBFB8"
    yellow          = "#F5C842"
    white           = "#FFFFFF"
    # Feature-panel pastels (originally hardcoded in esio.css; tokenised here so
    # they participate in the theme system and can be remapped per mode below).
    panelLavender   = "#C4B5DE"
    panelSteel      = "#3A5A8C"
    panelPeriwinkle = "#9CC5DF"

    # Alternative palettes. Each block adds the four named colors from the
    # palette as flat keys (prefixed by palette initials) so the [params.theme]
    # resolver can `index` them. Unused colors stay emitted as CSS vars — that's
    # harmless and keeps the system flat.

    # "Modern Professional"
    mpNavy          = "#002B4D"  # navy blue
    mpTeal          = "#0A5F6E"  # deep teal
    mpCoral         = "#EF525B"  # coral red
    mpGold          = "#F3C775"  # soft gold

    # "Tech-Forward"
    tfSlate         = "#374785"  # dark slate blue
    tfCyan          = "#3ABEFF"  # bright cyan
    tfPink          = "#EF019F"  # vibrant pink
    tfPurple        = "#8200FF"  # electric purple

    # "Cultivated Warmth"
    cwOlive         = "#5C6B51"  # deep olive
    cwBeige         = "#CCBAA3"  # warm beige
    cwCoral         = "#DF745E"  # muted coral
    cwSage          = "#B1CCA3"  # soft sage

    # "Timeless Confidence"
    tcNavy          = "#1F2937"  # navy blue
    tcSteel         = "#4B5B75"  # steel blue
    tcRed           = "#B92B27"  # deep red
    tcSlate         = "#7C8B99"  # slate gray

    # "Refreshing Summer Fun"
    sfSky           = "#8ECAE6"  # sky blue (light)
    sfBlue          = "#219EBC"  # blue green
    sfNavy          = "#023047"  # deep space blue
    sfAmber         = "#FFB703"  # amber flame
    sfOrange        = "#FB8500"  # tiger orange

    # "Sunrise Glow"
    sgCharcoal      = "#233D4D"  # charcoal blue
    sgPumpkin       = "#FE7F2D"  # pumpkin spice
    sgPollen        = "#FCCA46"  # golden pollen
    sgOlive         = "#A1C181"  # muted olive
    sgSeagrass      = "#619B8A"  # seagrass

    # "Twilight Comfort"
    twPrussian      = "#14213D"  # prussian blue
    twBanana        = "#FFF06D"  # banana cream
    twIndigo        = "#424969"  # twilight indigo
    twPowder        = "#BFC9DD"  # powder blue
    twOrange        = "#FCA311"  # orange

    # "Electric Citrus"
    ecBlack         = "#071824"  # deep blue-black
    ecNavy          = "#0D3145"  # dark navy
    ecLime          = "#DFFF72"  # electric lime
    ecCyan          = "#4FD1FF"  # bright cyan
    ecAmber         = "#FFC857"  # warm amber
    ecOff           = "#F5FAFC"  # off-white
    ecSlate         = "#A8BBC7"  # slate gray

  [params.typography]
    fontFamily   = "Plus Jakarta Sans"
    fontWeights  = "400;500;600;700;800;900"

  [params.radii]
    base  = "16px"
    large = "24px"

  # ──────────────────────────────────────────────────────────────────────────
  # Theme tokens (Material 3 semantic naming).
  # Each value is the *name* of a brand color in [params.colors] above.
  # styles.css resolves the lookup at build time so the brand palette stays
  # the only place hex values live. Rebrand → edit [params.colors].
  # Re-theme (e.g. tweak the dark→light mapping) → edit here.
  # ──────────────────────────────────────────────────────────────────────────
  [params.theme]
    default = "dark"

    [params.theme.dark]
      colorScheme          = "dark"      # browser hint for native form controls / scrollbars
      label                = "theme_dark"
      surface              = "navy"      # default page surface (body, hero, pricing)
      surfaceDim           = "navyDark"  # recessed sections (video, how, cta, footer)
      surfaceContainerHigh = "navyMid"   # elevated (setup section, popovers)
      onSurface            = "white"
      primary              = "terra"
      primaryContainer     = "terraDark"
      onPrimary            = "white"
      inverseSurface       = "white"
      inverseOnSurface     = "navyDark"

      # Feature-panel backgrounds. Each .fp-N reads its bg from --color-panel-N;
      # values here are the *names* of brand colors in [params.colors] above.
      [params.theme.dark.panels]
        fp1 = "navy"
        fp2 = "teal"
        fp3 = "panelLavender"
        fp4 = "panelSteel"
        fp5 = "panelPeriwinkle"

    [params.theme.light]
      colorScheme          = "light"
      label                = "theme_light"
      surface              = "white"
      surfaceDim           = "terraPale" # subtle warm tint for recessed sections
      surfaceContainerHigh = "white"
      onSurface            = "navyDark"
      primary              = "terra"
      primaryContainer     = "terraPale"
      onPrimary            = "white"
      inverseSurface       = "navyDark"
      inverseOnSurface     = "white"

      # Light-mode panel mappings. Starting values are conservative — keep
      # already-pastel panels (lavender, periwinkle, teal) as-is; flip the
      # dark-bg panels (navy, steel) to lighter tones so the strip stays
      # readable on a white body.
      [params.theme.light.panels]
        fp1 = "terraPale"
        fp2 = "teal"
        fp3 = "panelLavender"
        fp4 = "navyMid"
        fp5 = "panelPeriwinkle"

    # ─── Alternative palettes ───────────────────────────────────────────────
    # Each block mirrors the dark/light structure. Panel mappings keep
    # fp1/fp4 dark and fp2/fp3/fp5 mid-light so the existing
    # `.fp-2/3/5 .fp-title{color:var(--color-navy-dark)}` rules still read OK.

    [params.theme."modern-pro"]
      colorScheme          = "dark"
      label                = "theme_modern_pro"
      surface              = "mpNavy"
      surfaceDim           = "mpTeal"
      surfaceContainerHigh = "mpTeal"
      onSurface            = "white"
      primary              = "mpCoral"
      primaryContainer     = "mpGold"
      onPrimary            = "white"
      inverseSurface       = "white"
      inverseOnSurface     = "mpNavy"

      [params.theme."modern-pro".panels]
        fp1 = "mpNavy"
        fp2 = "mpGold"
        fp3 = "mpCoral"
        fp4 = "mpTeal"
        fp5 = "mpGold"

    [params.theme."tech-forward"]
      colorScheme          = "dark"
      label                = "theme_tech_forward"
      surface              = "tfSlate"
      surfaceDim           = "navyDark"
      surfaceContainerHigh = "tfSlate"
      onSurface            = "white"
      primary              = "tfPink"
      primaryContainer     = "tfPurple"
      onPrimary            = "white"
      inverseSurface       = "white"
      inverseOnSurface     = "tfSlate"

      [params.theme."tech-forward".panels]
        fp1 = "tfSlate"
        fp2 = "tfCyan"
        fp3 = "tfPink"
        fp4 = "tfPurple"
        fp5 = "tfCyan"

    [params.theme."cultivated-warmth"]
      colorScheme          = "light"
      label                = "theme_cultivated_warmth"
      surface              = "cwBeige"
      surfaceDim           = "cwSage"
      surfaceContainerHigh = "white"
      onSurface            = "cwOlive"
      primary              = "cwCoral"
      primaryContainer     = "cwSage"
      onPrimary            = "white"
      inverseSurface       = "cwOlive"
      inverseOnSurface     = "cwBeige"

      [params.theme."cultivated-warmth".panels]
