baseURL = "https://esio.dk/"
title = "ESIO"
theme = "esio-theme"
defaultContentLanguage = "en"
enableRobotsTXT = true
enableGitInfo = true
enableEmoji = true

# Microsoft Clarity. Fill `id` with your Clarity Project ID (a short string from
# clarity.microsoft.com → Settings → Setup). Loaded via Klaro consent (see
# themes/esio-theme/layouts/_partials/head/consent.html). Leaving `id` empty
# disables Clarity entirely; the consent banner still renders.
[params.clarity]
  id = "wlre5xyz6c"

# Umami self-hosted analytics. Cookieless, first-party — no consent required
# under the CNIL/EDPB audience-measurement exemption (Datatilsynet follows).
# Loaded unconditionally via themes/esio-theme/layouts/_partials/head/tracking.html.
# Get the UUID from analytics.esio.dk (Settings → Websites → Add → copy "Website ID").
# Empty websiteId = partial emits nothing.
[params.umami]
  websiteId = "b19c9f98-890b-4325-91be-1d39f3080369"

# Self-hosted Listmonk newsletter. The /newsletter/ page POSTs directly to
# the public subscribe endpoint. Get listUuid from analytics.esio.dk's admin
# at Settings → Lists → click the target list → "UUID" field at the top.
[params.newsletter]
  endpoint  = "https://newsletter.esio.dk/subscription/form"
  listUuid  = "0c9b3c13-a789-480b-a365-120feca25898"   # paste from Listmonk admin; empty value disables the form

# Self-hosted Altcha PoW captcha. Endpoint served by altcha-verify (Go service
# in infra/captcha/altcha-verify/ on the esiobudget repo, runs as part of the
# monitoring-server stack). Empty challengeUrl disables the widget.
[params.captcha]
  challengeUrl = "https://captcha.esio.dk/altcha/challenge"

# Each language gets a `/lang/` URL prefix for non-default languages and lives
# at the root for the default. Section data lives under data/<lang>/sections/.
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[languages]
  [languages.en]
    locale = "en-us"
    label = "English"
    weight = 1
    [languages.en.params]
      # Short tagline — used in <title>, og:description fallback, JSON-LD
      # description fallback. Per-page front-matter `description:` overrides
      # this for <meta description> on individual pages.
      description = "Budgeting Software for Small Business & Startups"

  [languages.da]
    locale = "da-dk"
    label = "Dansk"
    weight = 2
    [languages.da.params]
      description = "Budgetsoftware til små virksomheder & iværksættere"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

[build]
  writeStats = true

# ──────────────────────────────────────────────────────────────────────────────
# Site params
#   All design tokens live here. Editing a value below changes the rendered
#   site after `hugo` rebuilds. Templates must NEVER hardcode these values.
# ──────────────────────────────────────────────────────────────────────────────
[params]
  # description lives under [languages.<lang>.params] above so each language
  # gets its own tagline. Don't set it here — that would override the
  # per-language values via Hugo's params merge order.
  platformUrl = "https://budget.esio.dk/Login"

  # CVR (Centrale Virksomhedsregister) — Danish business registration number.
  # Surfaced via the {{< cvr >}} shortcode on contact / legal pages so this
  # value lives in exactly one place.
  cvr = "12345678"

  # Default Open Graph / Twitter Card image. Used on every page that doesn't
  # set its own `image:` or `cover:` in front-matter. Should be 1200x630
  # (1.91:1) so social platforms render the "large summary" card. Drop the
  # file at static/assets/share/og-default.jpg (or change the path here).
  ogImage = "/assets/share/og-default.jpg"

  # Optional. If set, emits twitter:site and twitter:creator meta tags.
  # twitterHandle = "@esio_dk"

  # ──────────────────────────────────────────────────────────────────────────
  # Material 3 palette catalogue.
  # Every entry below is loaded into the compiled CSS, scoped by
  # :root[data-palette="<name>"]. The site's top-of-page settings panel
  # renders one swatch per option; clicking it sets data-palette on <html>
  # and persists the choice to localStorage (see assets/js/shared/theme.js).
  # The styles.css bridge maps --md-sys-color-* → --color-* across all
  # palettes — adding a new palette only requires dropping CSS files into
  # m3/<name>/{light,dark}.css and appending an entry below.
  #
  # `swatch` is the hex shown in the picker chip (typically the MTB primary,
  # which differs slightly from the input key color because MTB normalises
  # to tone-40 — see _docs/color-decisions.md).
  [params.m3]
    # Site palette locked to indigo-mtb. The picker UI in settings.html has
    # been removed (only the light/dark theme toggle remains). Other palette
    # folders (indigo, blue-vibrant) still exist under m3/ for ad-hoc
    # experimentation but are not user-switchable from the chrome.
    default = "indigo"

    # No [[params.m3.options]] — the picker partial only renders entries
    # from this list, so an empty list means no palette swatches in the UI.
    # Re-add entries here if you want the picker back.

  [params.colors]
    # ESIO brand palette — used by both the Dark theme (default brand) and
    # Light theme (daytime variant of the same brand).
    # Signature: navy + terra + white + a panel accent (4 colors that define
    # the brand's identity). The remaining tokens are functional derivatives:
    # navy* shades create layered depth, terra* shades cover hover/container
    # states, and the panel pastels give the feature strip its variety.
    navy            = "#1B2B6B"  # signature — primary surface (Dark)
    navyDark        = "#111E4A"  # depth — recessed surfaces
    navyMid         = "#243580"  # depth — elevated surfaces
    terra           = "#E07B5B"  # signature — primary accent (both themes)
    terraDark       = "#C46340"  # state — Dark theme's primaryContainer / hover
    terraLight      = "#F09070"  # state — Light theme's primaryContainer
    terraPale       = "#FAE8DF"  # state — Light theme's surfaceDim
    white           = "#FFFFFF"  # signature — text on dark / surface on light
    teal            = "#4DBFB8"  # accent — used by marketing SVGs as creative fleck
    yellow          = "#F5C842"  # accent — "Most Popular" pricing badge (CSS-direct,
                                 # a saturated attention yellow distinct from
                                 # status `warning` which is paler / more citrus)
    purple          = "#6B5B9E"  # accent — decorative avatars + how-steps gradient
                                 # (CSS-direct, no longer used as a section bg)

    # ─── Status colours ─────────────────────────────────────────────────────
    # Sourced verbatim from EsioBudget.WebApp/wwwroot/css/site.css (--rz-*
    # tokens). These are domain-level "what does this number mean" colours
    # used by both the marketing site (illustrations, status badges) and
    # the live product (variance indicators, alerts). They're CSS-direct
    # tokens — not assigned to any theme slot — because a positive number
    # should always look "positive" regardless of which theme is active.
    success         = "#386A20"  # forest green — positive variance, on-track, growth
    danger          = "#b3261e"  # deep red — losses, overdue, error states
    warning         = "#e8e971"  # citrus yellow — caution, VAT deadlines, review
    info            = "#085786"  # deep blue — neutral notices, informational banners

    # "App preview" — mirrors the in-app Radzen palette so the marketing
    # site can preview the actual product UI. Source: EsioBudget.WebApp/
    # wwwroot/css/site.css (--rz-* tokens). The `eb` prefix is historical —
    # it documents the source (Esio Budget app) and stays even though the
    # theme key is now `app-preview`.
    # Signature: ebPrimary + ebSecondary + ebBaseLight + ebOnBase (4 colors
    # that define this theme's identity). The rest are functional derivatives
    # for depth/containers/inverse surfaces.
    ebPrimary         = "#3481e5"  # bright blue (signature — primary accent)
    ebPrimaryLight    = "#bcd8ff"  # soft blue (primaryContainer)
    ebPrimaryDarker   = "#00215d"  # deep navy (inverseSurface / panel fp1)
    ebSecondary       = "#5b6471"  # slate grey (signature — panel fp4)
    ebSecondaryLight  = "#c2cddc"  # light slate (panel fp3)
    ebBase            = "#dfe5ec"  # neutral base (surfaceDim)
    ebBaseLight       = "#f8fafb"  # almost-white (signature — default surface)
    ebOnBase          = "#1b1d20"  # near-black (signature — text on surface)

    # ─── App preview — DARK mode ────────────────────────────────────────────
    # Mirrors Radzen's dark-mode overrides for the same product UI. Source:
    # EsioBudget.WebApp/wwwroot/css/material3-dark-base.css (:root block). In
    # the app, switching to dark mode swaps every --rz-* token to these
    # values; we mirror that here so the marketing site's `app-preview-dark`
    # theme previews the actual product's dark mode. Same `eb` heritage,
    # `ebDark*` to disambiguate from the light family.
    ebDarkPrimary       = "#94c1ff"  # light blue (primary in dark mode)
    ebDarkPrimaryLight  = "#bcd7ff"  # soft blue (primaryContainer)
    ebDarkPrimaryDarker = "#001f5d"  # deepest navy (onPrimary — high contrast on light-blue button)
    ebDarkSecondary     = "#c2cbdc"  # light slate (secondary inverts in dark)
    ebDarkBody          = "#1f2226"  # --rz-base-700 — main dark surface (app body bg)
    ebDarkRaised        = "#292c30"  # --rz-base-600 — raised panels above the body
    ebDarkSurfaceDeep   = "#121518"  # --rz-base-900 — deepest recessed bg
    ebDarkBaseLight     = "#e0e4e9"  # --rz-base-50 — inverse surface (light strip on dark bg)
    ebDarkBase          = "#45494f"  # --rz-base — neutral dark
    ebDarkOnBase        = "#ffffff"  # text on dark surface

    # ─── Material Theme Builder palette ─────────────────────────────────────
    # Source of truth for the M3 palette is now this block (previously the
    # CSS bridge at themes/esio-theme/assets/css/m3/{light,dark}.css). Values
    # captured 2026-05-20 from Material Theme Builder output. Regenerate by
    # re-running MTB with the same key color (the m3LightPrimary below) and
    # replacing this block. Tertiary/secondary/error families are present in
    # MTB output but not yet wired into [params.theme.X] — see
    # _docs/color-decisions.md for the rationale.
    #
    # Light theme (M3) — daylight surfaces with deep saturated blue primary.
    m3LightPrimary              = "#005bb2"
    m3LightOnPrimary            = "#ffffff"
    m3LightPrimaryContainer     = "#1f74d7"
    m3LightSurface              = "#f9f9ff"
    m3LightSurfaceDim           = "#d8dae2"
    m3LightSurfaceContainer     = "#eceef6"
    m3LightSurfaceContainerHigh = "#e6e8f1"
    m3LightOnSurface            = "#191c22"
    m3LightInverseSurface       = "#2d3037"
    m3LightInverseOnSurface     = "#eff0f9"
    # Tertiary — purple, +60° hue rotation from primary blue. Used for the
    # second accent (decorative blobs, secondary CTAs, badge variations) so
    # the page isn't a single-hue wash. Distinct from primary, harmonised via
    # tone (same M3 tone-40 light / tone-80 dark as primary).
    m3LightTertiary             = "#883a9d"
    m3LightOnTertiary           = "#ffffff"
    m3LightTertiaryContainer    = "#a454b8"
    m3LightOnTertiaryContainer  = "#fffbff"

    # Dark theme (M3) — near-black surfaces with light-blue primary.
    m3DarkPrimary              = "#a9c7ff"
    m3DarkOnPrimary            = "#003063"
    m3DarkPrimaryContainer     = "#4891f6"
    m3DarkSurface              = "#101319"
    m3DarkSurfaceDim           = "#101319"
    m3DarkSurfaceContainer     = "#1d2026"
    m3DarkSurfaceContainerHigh = "#272a30"
    m3DarkOnSurface            = "#e1e2eb"
    m3DarkInverseSurface       = "#e1e2eb"
    m3DarkInverseOnSurface     = "#2d3037"
    # Tertiary dark — light pink/purple (M3 tone-80), pairs with the lighter
    # primary blue (#a9c7ff) for dark-surface contrast.
    m3DarkTertiary             = "#f2afff"
    m3DarkOnTertiary           = "#55006b"
    m3DarkTertiaryContainer    = "#c370d7"
    m3DarkOnTertiaryContainer  = "#30003e"

  [params.typography]
    # Body text — humanist sans designed for UI legibility at 14–18px.
    # Pairs cleanly with a serif display font.
    fontFamily   = "Inter"
    fontWeights  = "400;500;600;700;800;900"
    # Display headlines — variable serif, magazine-style register.
    # Leave displayFontFamily blank to fall back to fontFamily for headlines.
    displayFontFamily  = "Fraunces"
    displayFontWeights = "500;700;800;900"

  [params.radii]
    base  = "16px"
    large = "24px"

  # ──────────────────────────────────────────────────────────────────────────
  # Theme tokens (Material 3 semantic naming).
  # Each value is the *name* of a brand color in [params.colors] above.
  # styles.css resolves the lookup at build time so the brand palette stays
  # the only place hex values live. Rebrand → edit [params.colors].
  # Re-theme (e.g. tweak the dark→light mapping) → edit here.
  # ──────────────────────────────────────────────────────────────────────────
  [params.theme]
    default = "dark"

    # ─── Brand themes commented out 2026-05-20 ──────────────────────────────
    # The brand-styled (navy+terra) dark and light themes are temporarily
    # disabled. The picker now shows the Radzen-styled themes only, with the
    # `light` and `dark` slot names taken over by what were previously named
    # `app-preview` and `app-preview-dark`. To restore the brand picker
    # entries, uncomment the two blocks below AND rename the current `dark`
    # and `light` blocks back to `app-preview-dark` and `app-preview` so
    # both layers can coexist.
    #
    # [params.theme.dark-brand]
    #   colorScheme          = "dark"
    #   label                = "theme_dark"
    #   surface              = "navy"
    #   surfaceDim           = "navyDark"
    #   surfaceContainerHigh = "navyMid"
    #   onSurface            = "white"
    #   primary              = "terra"
    #   primaryContainer     = "terraDark"
    #   onPrimary            = "navyDark"
    #   inverseSurface       = "white"
    #   inverseOnSurface     = "navyDark"
    #   [params.theme.dark-brand.panels]
    #     fp1 = "navyMid"; fp2 = "navy"; fp3 = "navyMid"; fp4 = "navy"; fp5 = "navyMid"
    #
    # [params.theme.light-brand]
    #   colorScheme          = "light"
    #   label                = "theme_light"
    #   surface              = "white"
    #   surfaceDim           = "terraPale"
    #   surfaceContainerHigh = "white"
    #   onSurface            = "navyDark"
    #   primary              = "terra"
    #   primaryContainer     = "terraLight"
    #   onPrimary            = "navyDark"
    #   inverseSurface       = "navyDark"
    #   inverseOnSurface     = "white"
    #   [params.theme.light-brand.panels]
    #     fp1 = "terraPale"; fp2 = "white"; fp3 = "terraPale"; fp4 = "white"; fp5 = "terraPale"

    # ─── Light ──────────────────────────────────────────────────────────────
    # Material Theme Builder palette, daylight. Key color: deep saturated
    # blue (m3LightPrimary). The Radzen-mirroring ebBaseLight / ebPrimary
    # mapping is preserved below as a comment in case you want to revert.
    [params.theme.light]
      colorScheme          = "light"
      label                = "theme_light"
      surface              = "m3LightSurface"
      surfaceDim           = "m3LightSurfaceDim"
      surfaceContainerHigh = "m3LightSurfaceContainerHigh"
      onSurface            = "m3LightOnSurface"
      primary              = "m3LightPrimary"
      primaryContainer     = "m3LightPrimaryContainer"
      onPrimary            = "m3LightOnPrimary"
      tertiary             = "m3LightTertiary"
      onTertiary           = "m3LightOnTertiary"
      tertiaryContainer    = "m3LightTertiaryContainer"
      onTertiaryContainer  = "m3LightOnTertiaryContainer"
      inverseSurface       = "m3LightInverseSurface"
      inverseOnSurface     = "m3LightInverseOnSurface"

      # Two-tone alternation: alternates between the MTB "surface-container"
      # (recessed neutral) and "surface" (default) tones.
      [params.theme.light.panels]
        fp1 = "m3LightSurfaceContainer"
        fp2 = "m3LightSurface"
        fp3 = "m3LightSurfaceContainer"
        fp4 = "m3LightSurface"
        fp5 = "m3LightSurfaceContainer"
    #
    # Previous Radzen-light mapping (kept for reference, uncomment to revert):
    # [params.theme.light]
    #   surface = "ebBaseLight"; surfaceDim = "ebBase"; surfaceContainerHigh = "white"
    #   onSurface = "ebOnBase"; primary = "ebPrimary"; primaryContainer = "ebPrimaryLight"
    #   onPrimary = "white"; inverseSurface = "ebPrimaryDarker"; inverseOnSurface = "ebBaseLight"
    #   [params.theme.light.panels]
    #     fp1 = "ebBase"; fp2 = "ebBaseLight"; fp3 = "ebBase"; fp4 = "ebBaseLight"; fp5 = "ebBase"

    # ─── Dark ───────────────────────────────────────────────────────────────
    # Mirrors the Radzen dark-mode palette (material3-dark-base.css). Was
    # `app-preview-dark`. Primary is the lighter blue (#94c1ff) because on a
    # dark surface the saturated brand-blue would be too low-contrast;
    # Radzen's design choice is to lighten primary in dark mode.
    [params.theme.dark]
      colorScheme          = "dark"
      label                = "theme_dark"
      surface              = "m3DarkSurface"
      surfaceDim           = "m3DarkSurfaceDim"
      surfaceContainerHigh = "m3DarkSurfaceContainerHigh"
      onSurface            = "m3DarkOnSurface"
      primary              = "m3DarkPrimary"
      primaryContainer     = "m3DarkPrimaryContainer"
      onPrimary            = "m3DarkOnPrimary"
      tertiary             = "m3DarkTertiary"
      onTertiary           = "m3DarkOnTertiary"
      tertiaryContainer    = "m3DarkTertiaryContainer"
      onTertiaryContainer  = "m3DarkOnTertiaryContainer"
      inverseSurface       = "m3DarkInverseSurface"
      inverseOnSurface     = "m3DarkInverseOnSurface"

      # Two-tone alternation between MTB "surface-container" and "surface".
      [params.theme.dark.panels]
        fp1 = "m3DarkSurfaceContainer"
        fp2 = "m3DarkSurface"
        fp3 = "m3DarkSurfaceContainer"
        fp4 = "m3DarkSurface"
        fp5 = "m3DarkSurfaceContainer"
    #
    # Previous Radzen-dark mapping (kept for reference, uncomment to revert):
    # [params.theme.dark]
    #   surface = "ebDarkBody"; surfaceDim = "ebDarkSurfaceDeep"; surfaceContainerHigh = "ebDarkRaised"
    #   onSurface = "ebDarkOnBase"; primary = "ebDarkPrimary"; primaryContainer = "ebDarkPrimaryLight"
    #   onPrimary = "ebDarkPrimaryDarker"; inverseSurface = "ebDarkBaseLight"; inverseOnSurface = "ebDarkBody"
    #   [params.theme.dark.panels]
    #     fp1 = "ebDarkRaised"; fp2 = "ebDarkBody"; fp3 = "ebDarkRaised"; fp4 = "ebDarkBody"; fp5 = "ebDarkRaised"
