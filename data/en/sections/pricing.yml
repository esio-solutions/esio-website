tag: Pricing
headline: Simple, transparent pricing
subtitle: >-
  No hidden fees. No surprise invoices. Cancel anytime. All prices exclude
  taxes.

billingToggle:
  yearlyLabel: Billed yearly
  monthlyLabel: Billed monthly
  ariaLabel: Toggle between yearly and monthly billing

tiers:
  - id: trial
    name: Trial
    currency: DKK
    yearlyPrice: "0"
    monthlyPrice: "0"
    yearlyPeriod: first 14 days free
    monthlyPeriod: first 14 days free
    description: >-
      Start with a free 14-day trial and explore the core tools before
      choosing a paid plan.
    features:
      - Liquidity Forecasting
      - Accounting software integration (E-conomic/Dinero)
      - Tax Helper
      - Up to 1 budget per account
    cta:
      label: Get Started
      href: https://budget.esio.dk/Login
      style: ghost
    featured: false

  - id: small-business
    name: Small Business
    currency: DKK
    yearlyPrice: "139"
    monthlyPrice: "159"
    yearlyPeriod: per month, billed annually
    monthlyPeriod: per month, billed monthly
    description: >-
      The complete toolkit for established small businesses ready to take full
      control of their finances.
    features:
      - Liquidity Forecasting
      - Accounting software integration (E-conomic/Dinero)
      - Visualisation of both past account data and future forecasting data
      - Tax Helper
      - Up to 3 budgets per account
    cta:
      label: Get Started
      href: https://budget.esio.dk/Login
      style: featured
    featured: true
    badge: Most Popular

  - id: startup
    name: Startup
    currency: DKK
    yearlyPrice: "79"
    monthlyPrice: "99"
    yearlyPeriod: per month, billed annually
    monthlyPeriod: per month, billed monthly
    description: >-
      Perfect for freelancers and early-stage startups getting their finances
      in order for the first time.
    features:
      - Liquidity Forecasting
      - Tax Helper
      - Up to 1 budget per account
    cta:
      label: Get Started
      href: https://budget.esio.dk/Login
      style: ghost
    featured: false
