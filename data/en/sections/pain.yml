tag: The Problem
headline:
  primary: "Running a business is hard."
  emphasis: "Finances don't have to be."

subtitle: >-
  Most small businesses lose thousands every year to avoidable tax mistakes,
  missed deductions, and poor cash flow visibility. ESIO fixes that —
  automatically.

illustration:
  src: /assets/pain-01.svg
  alt: ""

badges:
  - id: b1
    label: Tax Saved
    value: EUR 4,280
    trend: "+32% this quarter"
  - id: b2
    label: Next Deadline
    value: 14 days
    trend: VAT Return Due
    trendVariant: deadline

cards:
  - icon: "😰"
    title: Surprise Tax Bills
    body: >-
      End-of-year tax bills that catch you completely off guard. ESIO tracks
      your obligations in real-time so there are never any surprises — you
      always know exactly what you owe and when.
  - icon: "🌫️"
    title: No Clear Picture
    body: >-
      Spreadsheets, bank statements, and receipts scattered across a dozen
      tools. ESIO connects everything in one place and transforms raw numbers
      into crystal-clear insights you can actually act on.
  - icon: "⏰"
    title: Constant Doubt
    body: >-
      Second-guessing when to invest or whether your business is on track to
      be profitable can be overwhelming. ESIO gives you clear, reliable
      answers, so you always know where your business stands and can make the
      best financial decisions for your company.
