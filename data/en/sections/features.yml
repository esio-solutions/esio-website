intro:
  tag: Features
  headline: |-
    Everything
    your business
    needs finally
    in one place
  subtitle: >-
    Intelligent tools built for founders, freelancers, and growing teams who
    want clarity without complexity.
  iconGrid:
    - /assets/esio-icon02.svg
    - /assets/esio-icon03.svg
    - /assets/esio-icon01.svg
    - /assets/esio-icon05.svg
  illustration: /assets/features-02.svg

panels:
  - id: cashflow
    title: |-
      Cashflow Simulations
      and Reports
    body: >-
      See exactly where your money is going — and where it could go. ESIO
      generates interactive cashflow simulations based on your real data,
      helping you plan ahead with confidence.
    maskIcon: "05"
    illustration: /assets/features-07.svg
    flipped: true

  - id: tax
    title: |-
      Intelligent Tax
      Forecasting
    body: >-
      Stop guessing what you owe. ESIO calculates your tax obligations in
      real-time, tracks every deadline, and surfaces deductions you didn't
      know existed.
    maskIcon: "01"
    illustration: /assets/footer-06.svg

  - id: projections
    title: |-
      Financial
      Projections
    body: >-
      Model multiple growth scenarios and understand the financial
      implications before you commit. Plan hiring, investment, and expansion
      with data-backed confidence.
    maskIcon: "02"
    illustration: /assets/features-05.svg

  - id: expenses
    title: |-
      Easy Expenses
      & Income Viewer
    body: >-
      All your transactions in one place: organized, searchable, and
      export-ready. ESIO connects with platforms like Dinero and your
      e-commerce tools to keep your financial data up to date automatically.
    maskIcon: "03"
    illustration: /assets/features-04.svg
