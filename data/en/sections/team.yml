intro:
  tag: "Who we are"
  headline: "Two people who get how small businesses really work"
  body: >-
    We're not trying to build the next big thing. We made ESIO because the
    tools out there are built for big companies, accountants charging by the
    hour, or hobby spreadsheets — not for the shop, the workshop, the café
    or the family business that just wants their numbers to make sense.

members:
  - name: "Elod Sandor"
    role: "Co-founder · Accountant"
    photo: "/assets/team/elod.jpeg"
    bio: >-
      Elod has spent years helping small businesses keep their books in
      order — the kind of places where the owner does the invoicing in the
      evening and worries about VAT on a Sunday. He knows what actually
      matters when money is tight and time is tighter.
    quote: ""

  - name: "Iustinian Olaru"
    role: "Co-founder · Software engineer"
    photo: "/assets/team/iustinian.png"
    bio: >-
      Iustinian builds the software. He's worked on systems for everyone
      from one-person operations to large companies, and he's seen how
      often the small ones get left behind. ESIO is his answer to that —
      tools that respect your time and don't pretend you're a corporation.
    quote: ""

