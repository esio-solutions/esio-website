tag: Who we are
headline: Two people who get how small businesses really work
body: We're not trying to build the next big thing. We made ESIO because the tools out there are built for big companies, accountants charging by the hour, or hobby spreadsheets — not for the shop, the workshop, the café or the family business that just wants their numbers to make sense.
cta:
  text: Got a question? Write to us — we read every message ourselves.
  link_label: hello@esio.dk →
  link_href: mailto:hello@esio.dk
