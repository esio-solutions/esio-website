tag: Problemet
headline:
  primary: At drive en virksomhed er svært.
  emphasis: Økonomien behøver ikke at være det.
subtitle: De fleste små virksomheder mister tusindvis af kroner hvert år på grund af undgåelige skattefejl, mistede fradrag og manglende overblik over pengestrømmen. ESIO løser det — automatisk.
