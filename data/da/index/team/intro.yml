tag: Hvem vi er
headline: To, der forstår, hvordan små virksomheder rent faktisk fungerer
body: Vi prøver ikke at bygge det næste store. Vi lavede ESIO, fordi de værktøjer, der findes, er bygget til store firmaer, til revisorer der fakturerer pr. time, eller til hobby-regneark — ikke til butikken, værkstedet, caféen eller familievirksomheden, der bare vil have, at tallene giver mening.
cta:
  text: Har du et spørgsmål? Skriv til os — vi læser hver besked selv.
