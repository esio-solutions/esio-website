name: Elod Sandor
role: Medstifter · Revisor
photo: /assets/team/elod.jpeg
bio: Elod har i mange år hjulpet små virksomheder med at holde styr på bøgerne — den slags steder, hvor ejeren skriver fakturaer om aftenen og tænker på moms en søndag. Han ved, hvad der faktisk betyder noget, når pengene er små og tiden endnu mindre.
