tag: Nyhedsbrev
headline: Hold dig opdateret
subtitle: >-
  Produktopdateringer, økonomiske tips til stiftere og lejlighedsvise
  cases. Udsendes hver par uger. Ingen spam.

fields:
  name:
    label: Dit navn (valgfrit)
    placeholder: Jane Doe
  email:
    label: E-mail
    placeholder: jane@eksempel.dk

cta:
  label: Tilmeld →

legalNote: >-
  Du kan afmelde dig når som helst med ét klik. Vi deler ikke din adresse
  med andre.

fallback:
  body: >-
    Tilmeld dig via vores nyhedsbrevsplatform — åbner i ny fane.
  cta: Tilmeld på newsletter.esio.dk →

status:
  submitting: Tilmelder…
  success: >-
    Tak! Tjek din e-mail — vi har sendt et bekræftelseslink for at fuldføre
    din tilmelding.
  errorGeneric: >-
    Hov, noget gik galt hos os. Prøv igen om et øjeblik.
  errorNetwork: >-
    Kunne ikke nå serveren. Tjek din forbindelse og prøv igen.
  waitingForCaptcha: >-
    Vent et øjeblik — vi bekræfter, at du ikke er en bot.
