intro:
  tag: "Hvem vi er"
  headline: "To, der forstår, hvordan små virksomheder rent faktisk fungerer"
  body: >-
    Vi prøver ikke at bygge det næste store. Vi lavede ESIO, fordi de
    værktøjer, der findes, er bygget til store firmaer, til revisorer der
    fakturerer pr. time, eller til hobby-regneark — ikke til butikken,
    værkstedet, caféen eller familievirksomheden, der bare vil have, at
    tallene giver mening.

members:
  - name: "Elod Sandor"
    role: "Medstifter · Revisor"
    photo: "/assets/team/elod.jpeg"
    bio: >-
      Elod har i mange år hjulpet små virksomheder med at holde styr på
      bøgerne — den slags steder, hvor ejeren skriver fakturaer om aftenen
      og tænker på moms en søndag. Han ved, hvad der faktisk betyder noget,
      når pengene er små og tiden endnu mindre.
    quote: ""

  - name: "Iustinian Olaru"
    role: "Medstifter · Softwareingeniør"
    photo: "/assets/team/iustinian.png"
    bio: >-
      Iustinian bygger softwaren. Han har arbejdet med systemer til alt
      fra enkeltmandsvirksomheder til store firmaer, og han har set, hvor
      ofte de små bliver glemt. ESIO er hans svar på det — værktøjer, der
      respekterer din tid og ikke lader, som om du er en koncern.
    quote: ""

cta:
  text: "Har du et spørgsmål? Skriv til os — vi læser hver besked selv."
