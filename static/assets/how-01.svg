/* FEATURE ROWS */
.feat-row{display:grid;grid-template-columns:1fr 1fr;align-items:center;min-height:500px;border-top:1px solid rgba(255,255,255,0.08)}
.feat-row:last-child{border-bottom:1px solid rgba(255,255,255,0.08)}
.feat-row-rev .feat-text{order:2}
.feat-row-rev .feat-illo-wrap{order:1}
.feat-text{padding:60px 8%;display:flex;flex-direction:column;gap:16px}
.feat-icon{width:56px;height:56px;background:rgba(255,255,255,0.12);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px}
.feat-title{font-size:clamp(28px,3vw,44px);font-weight:900;color:#fff;line-height:1.1;letter-spacing:-1px}
.feat-desc{font-size:clamp(14px,1.3vw,16px);color:rgba(255,255,255,0.7);line-height:1.85;font-weight:500;max-width:440px}
.feat-illo-wrap{position:relative;height:500px;display:flex;align-items:center;justify-content:center;overflow:hidden}
/* Feature rows */
.feat-row{display:flex;align-items:center;gap:48px;margin-bottom:64px}
.feat-row-rev{flex-direction:row-reverse}
.feat-text{flex:1;min-width:280px}
.feat-illo-wrap{flex:1;position:relative;min-height:320px;display:flex;align-items:center;justify-content:center}

/* Illo card â€” rounded box like reference */







.feat-illo-svg{position:relative;z-index:2;width:90%;max-width:480px}
.feat-illo-svg svg{width:100%;height:auto;display:block}
@media(max-width:900px){
  .feat-row{grid-template-columns:1fr}
  .feat-row-rev .feat-text{order:0}
  .feat-row-rev .feat-illo-wrap{order:1}
  .feat-illo-wrap{height:320px}
}
