<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none" role="img" aria-label="Sign up and begin a short guided setup">
  <!-- Browser window frame -->
  <rect x="40" y="40" width="240" height="160" rx="14" fill="#FFFFFF" stroke="#1B2B6B" stroke-width="2.5"/>
  <line x1="40" y1="72" x2="280" y2="72" stroke="#1B2B6B" stroke-width="2.5"/>
  <circle cx="58" cy="56" r="4" fill="#E07B5B"/>
  <circle cx="74" cy="56" r="4" fill="#F5C842"/>
  <circle cx="90" cy="56" r="4" fill="#4DBFB8"/>
  <rect x="108" y="48" width="156" height="16" rx="8" fill="#FAE8DF"/>

  <!-- Headline + subhead placeholders -->
  <rect x="64" y="92" width="120" height="10" rx="5" fill="#1B2B6B"/>
  <rect x="64" y="110" width="76" height="6" rx="3" fill="#1B2B6B" opacity="0.25"/>

  <!-- Primary CTA -->
  <rect x="64" y="128" width="118" height="36" rx="18" fill="#E07B5B"/>
  <path d="M104 146 L138 146 M130 138 L138 146 L130 154" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Setup wizard progress strip: 1 active step + 3 upcoming -->
  <line x1="80" y1="184" x2="240" y2="184" stroke="#1B2B6B" stroke-width="1.5" opacity="0.25"/>
  <circle cx="80"  cy="184" r="6.5" fill="#E07B5B"/>
  <circle cx="80"  cy="184" r="2.5" fill="#FFFFFF"/>
  <circle cx="133" cy="184" r="6.5" fill="#FFFFFF" stroke="#1B2B6B" stroke-width="2" opacity="0.5"/>
  <circle cx="186" cy="184" r="6.5" fill="#FFFFFF" stroke="#1B2B6B" stroke-width="2" opacity="0.5"/>
  <circle cx="240" cy="184" r="6.5" fill="#FFFFFF" stroke="#1B2B6B" stroke-width="2" opacity="0.5"/>

  <!-- Cursor pointer over button -->
  <path d="M158 144 L158 168 L165 162 L170 172 L175 170 L170 161 L178 161 Z" fill="#1B2B6B" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>

  <!-- Motion trail behind cursor -->
  <circle cx="200" cy="158" r="2.5" fill="#E07B5B"/>
  <circle cx="216" cy="152" r="3"   fill="#E07B5B" opacity="0.65"/>
  <circle cx="234" cy="146" r="3.5" fill="#E07B5B" opacity="0.35"/>

  <!-- Spark accent -->
  <path d="M252 94 L252 110 M244 102 L260 102" stroke="#F5C842" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M246 96 L258 108 M258 96 L246 108" stroke="#F5C842" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
</svg>
