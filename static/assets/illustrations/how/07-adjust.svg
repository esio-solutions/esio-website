<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none" role="img" aria-label="Adjust your budget and instantly see the impact">
  <!-- Card — same dimensions, corner radius, and stroke as 06-forecast so
       the two illustrations read as a matched pair. -->
  <rect x="32" y="32" width="256" height="176" rx="14" fill="#FFFFFF" stroke="#1B2B6B" stroke-width="2.5"/>

  <!-- Header — title bar + subtitle bar, mirrors 06-forecast. -->
  <rect x="48" y="48" width="80" height="8" rx="4" fill="#1B2B6B"/>
  <rect x="48" y="62" width="48" height="4" rx="2" fill="#1B2B6B" opacity="0.4"/>

  <!-- Slider control, now nested inside the panel rather than floating
       above it. Track, fill, thumb, and a small bidirectional hint over
       the thumb to signal interactivity. -->
  <rect x="64" y="84" width="160" height="6" rx="3" fill="#1B2B6B" opacity="0.18"/>
  <rect x="64" y="84" width="108" height="6" rx="3" fill="#E07B5B"/>
  <circle cx="172" cy="87" r="9" fill="#FFFFFF" stroke="#E07B5B" stroke-width="2.5"/>
  <circle cx="172" cy="87" r="2.5" fill="#E07B5B"/>
  <path d="M 160 74 L 184 74 M 164 70 L 160 74 L 164 78 M 180 70 L 184 74 L 180 78" stroke="#4DBFB8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Axes -->
  <line x1="64" y1="108" x2="64"  y2="192" stroke="#1B2B6B" stroke-width="1.5" opacity="0.5"/>
  <line x1="64" y1="192" x2="272" y2="192" stroke="#1B2B6B" stroke-width="1.5" opacity="0.5"/>

  <!-- Gridlines — three faint horizontals, same pattern as 06-forecast. -->
  <line x1="64" y1="170" x2="272" y2="170" stroke="#1B2B6B" stroke-width="1" opacity="0.1"/>
  <line x1="64" y1="148" x2="272" y2="148" stroke="#1B2B6B" stroke-width="1" opacity="0.1"/>
  <line x1="64" y1="126" x2="272" y2="126" stroke="#1B2B6B" stroke-width="1" opacity="0.1"/>

  <!-- "Before" ghost line (dashed navy) — the baseline projection. -->
  <path d="M 72 180 L 110 176 L 148 170 L 186 164 L 224 158 L 260 152" stroke="#1B2B6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" opacity="0.35" fill="none"/>

  <!-- "After" active line (terra) with subtle area fill, mirroring the
       past/future area treatment in 06-forecast. -->
  <path d="M 72 180 L 110 170 L 148 154 L 186 138 L 224 122 L 260 108 L 260 192 L 72 192 Z" fill="#E07B5B" opacity="0.08"/>
  <path d="M 72 180 L 110 170 L 148 154 L 186 138 L 224 122 L 260 108" stroke="#E07B5B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="260" cy="108" r="3.5" fill="#E07B5B"/>

  <!-- Improvement delta arrow — shows the gap between the before/after
       endpoints. -->
  <path d="M 272 150 L 272 114 M 267 120 L 272 114 L 277 120" stroke="#4DBFB8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
