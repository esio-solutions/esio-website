{{ define "main" }}
  {{ partial "sections/nav.html" . }}

  <article class="bg-[var(--color-navy)] pt-[120px] pb-[90px] px-[6%]">
    <div class="max-w-[680px] mx-auto">
      <header class="mb-8">
        <time datetime='{{ .Date.Format "2006-01-02" }}'
              class="block text-xs text-white/50 font-bold uppercase tracking-widest mb-3">
          {{ .Date.Format "January 2, 2006" }}
        </time>
        <h1 class="text-white text-[clamp(28px,3.5vw,42px)] font-black leading-[1.1] tracking-tight">
          {{ .Title }}
        </h1>
      </header>

      <div class="prose prose-invert prose-lg max-w-none
                  prose-headings:text-white prose-headings:font-black
                  prose-a:text-[var(--color-terra-light)] hover:prose-a:text-[var(--color-terra)]
                  prose-strong:text-white prose-blockquote:border-[var(--color-terra)]">
        {{ .Content }}
      </div>
    </div>
  </article>

  {{ partial "sections/footer.html" . }}
{{ end }}
