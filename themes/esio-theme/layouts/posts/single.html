{{ define "main" }}
  {{ partial "sections/nav.html" . }}

  <article class="bg-surface pt-[120px] pb-[90px] px-[6%]">
    <div class="max-w-[680px] mx-auto">
      <header class="mb-8">
        <time datetime='{{ .Date.Format "2006-01-02" }}'
              class="block text-xs text-on-surface/50 font-bold uppercase tracking-widest mb-3">
          {{ .Date.Format "January 2, 2006" }}
        </time>
        <h1 class="text-on-surface text-[clamp(28px,3.5vw,42px)] font-black leading-[1.1] tracking-tight">
          {{ .Title }}
        </h1>
      </header>

      <div class="prose prose-lg max-w-none">
        {{ .Content }}
      </div>
    </div>
  </article>

  {{ partial "sections/footer.html" . }}
{{ end }}
