{{ define "main" }}
  {{ partial "sections/nav.html" . }}

  <article class="bg-surface pt-[120px] pb-[90px] px-[6%]">
    <div class="max-w-[760px] mx-auto">
      <header class="mb-10">
        <h1 class="text-on-surface text-[clamp(28px,3.5vw,46px)] font-black leading-[1.1] tracking-tight">{{ .Title }}</h1>
        {{ with .Params.description }}<p class="mt-4 text-on-surface/70 text-lg">{{ . }}</p>{{ end }}
      </header>

      <div class="prose prose-lg max-w-none">
        {{ .Content }}
      </div>
    </div>
  </article>

  {{ partial "sections/footer.html" . }}
{{ end }}
