{{- $lang := site.Language.Lang -}}
{{- $sub  := index site.Data $lang "index" "subscribe" "meta" -}}
<div class="slide">
  <div class="bg-blob-terra s5-blob"></div>
  <img class="character s5-character" src="/assets/characters/characters-03-gradient.svg" alt="">

  <div class="head">
    {{ partial "facebook/logo.html" . }}
    <span class="pageno">05 / 05</span>
  </div>

  <div class="body">
    <div class="body-text" style="max-width: 720px;">
      <div class="eyebrow">{{ $sub.tag }}</div>
      <h2 class="h-xl">{{ $sub.headline.prefix }}</h2>
      <h2 class="h-xl h-accent">{{ $sub.headline.suffix }}.</h2>
      <p class="lede mt-12" style="max-width: 560px;">{{ $sub.body }}</p>
      <div class="mt-16">
        <a class="cta">{{ $sub.formBox.cta.label }}</a>
      </div>
    </div>
  </div>

  <div class="foot">
    <span>esio.dk</span>
  </div>
</div>
