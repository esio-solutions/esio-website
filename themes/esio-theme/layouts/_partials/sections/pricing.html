{{- /*
  Pricing section. Three tiers with a yearly/monthly toggle.
  The toggle is wired with data attributes the inline <script> at the bottom
  reads at runtime — same contract as the original Astro version.
  Data: data/<lang>/index/pricing/
    meta.yml      — tag, headline, subtitle, billingToggle
    tiers/*.yml   — pricing tiers (alphabetical by filename = display order)
*/ -}}
{{- $data := index site.Data site.Language.Lang "index" "pricing" -}}
{{- $meta := $data.meta -}}
<section id="pricing" class="sec">
  <div class="si">
    <div class="tc">
      <span class="tag tag-t">{{ $meta.tag }}</span>
      <h2 class="stitle">{{ $meta.headline }}</h2>
      <p class="ssub">{{ $meta.subtitle }}</p>
    </div>
    <div class="billing-toggle" aria-label="Billing frequency switch">
      <span class="billing-label is-active" data-billing-label="yearly">{{ $meta.billingToggle.yearlyLabel }}</span>
      <button
        type="button"
        class="billing-switch"
        role="switch"
        aria-checked="false"
        aria-label="{{ $meta.billingToggle.ariaLabel }}"
      >
        <span class="billing-switch__thumb"></span>
      </button>
      <span class="billing-label" data-billing-label="monthly">{{ $meta.billingToggle.monthlyLabel }}</span>
    </div>
    <div class="price-grid">
      {{- range $k, $t := $data.tiers }}
        {{- $cardCls := cond $t.featured "pcard feat" "pcard" }}
        {{- /* featured tier → primary button (solid; inverts to white-bg
           when sitting on the featured card's primary surface, same way
           it inverts inside #subscribe). ghost tier → secondary button
           (outlined). Same .btn system used everywhere else on the site. */ -}}
        {{- $variant := cond (eq $t.cta.style "featured") "primary" "secondary" }}
        <div class="{{ $cardCls }}">
          {{- with $t.badge }}<div class="fbadge">{{ . }}</div>{{ end }}
          <div class="pname">{{ $t.name }}</div>
          <div class="pprice">
            <span class="pcurrency">{{ $t.currency }}</span>
            <span class="price-value" data-yearly-price="{{ $t.yearlyPrice }}" data-monthly-price="{{ $t.monthlyPrice }}">{{ $t.yearlyPrice }}</span>
          </div>
          <div class="pperiod" data-yearly-period="{{ $t.yearlyPeriod }}" data-monthly-period="{{ $t.monthlyPeriod }}">{{ $t.yearlyPeriod }}</div>
          <div class="pdesc">{{ $t.description }}</div>
          <ul class="pfeats">
            {{- range $t.features }}
              <li>{{ . }}</li>
            {{- end }}
          </ul>
          {{ partial "button.html" (dict "href" $t.cta.href "label" $t.cta.label "variant" $variant "event" $t.cta.event) }}
        </div>
      {{- end }}
    </div>
  </div>
</section>

<script>
  (function () {
    const section = document.querySelector('#pricing');
    if (!section) return;

    const toggle = section.querySelector('.billing-switch');
    const labels = section.querySelectorAll('[data-billing-label]');
    const prices = section.querySelectorAll('.price-value');
    const periods = section.querySelectorAll('.pperiod[data-yearly-period]');

    const update = (mode) => {
      const monthly = mode === 'monthly';
      toggle.setAttribute('aria-checked', String(monthly));
      toggle.classList.toggle('is-monthly', monthly);
      labels.forEach((l) => l.classList.toggle('is-active', l.getAttribute('data-billing-label') === mode));
      prices.forEach((p) => {
        const next = monthly ? p.getAttribute('data-monthly-price') : p.getAttribute('data-yearly-price');
        if (next != null) p.textContent = next;
      });
      periods.forEach((p) => {
        const next = monthly ? p.getAttribute('data-monthly-period') : p.getAttribute('data-yearly-period');
        if (next != null) p.textContent = next;
      });
    };

    toggle.addEventListener('click', () => {
      const monthly = toggle.getAttribute('aria-checked') === 'true';
      update(monthly ? 'yearly' : 'monthly');
    });
    update('yearly');
  })();
</script>
