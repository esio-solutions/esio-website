{{- /*
  Reusable page header for content pages (articles, posts, legal). Mirrors
  the homepage nav so brand chrome stays consistent across the site.
*/ -}}
{{ partial "sections/nav.html" . }}
<header class="bg-[var(--color-navy-dark)] pt-[120px] pb-12 px-[6%]">
  <div class="max-w-[1120px] mx-auto text-center">
    <h1 class="text-white text-[clamp(28px,3.5vw,48px)] font-black tracking-tight leading-[1.08] mb-3">
      {{ .Title }}
    </h1>
    {{ with .Params.description }}
      <p class="text-white/65 text-[clamp(14px,1.3vw,16px)] leading-[1.7] max-w-[640px] mx-auto">{{ . }}</p>
    {{ end }}
  </div>
</header>
