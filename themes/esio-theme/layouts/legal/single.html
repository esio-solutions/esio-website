{{ define "main" }}
  {{ partial "sections/nav.html" . }}

  <article class="bg-surface pt-[120px] pb-[90px] px-[6%]">
    <div class="max-w-[820px] mx-auto">
      <header class="mb-10">
        <p class="text-primary text-xs font-extrabold uppercase tracking-widest mb-3">Legal</p>
        <h1 class="text-on-surface text-[clamp(28px,3.5vw,46px)] font-black tracking-tight leading-[1.1]">{{ .Title }}</h1>
        {{ with .Lastmod }}
          <p class="mt-4 text-sm text-on-surface/45">Last updated {{ .Format "January 2, 2006" }}</p>
        {{ end }}
      </header>

      {{ with .TableOfContents }}
        <nav class="mb-10 bg-on-surface/5 border border-on-surface/12 rounded-[var(--radius-base)] p-6">
          <p class="text-xs font-extrabold uppercase tracking-widest text-on-surface/55 mb-3">Contents</p>
          <div class="text-on-surface/80 [&_a]:text-primary [&_a:hover]:opacity-80 [&_ul]:list-none [&_ul]:pl-0 [&_li]:mb-1.5">
            {{ . }}
          </div>
        </nav>
      {{ end }}

      <div class="prose prose-lg max-w-none">
        {{ .Content }}
      </div>
    </div>
  </article>

  {{ partial "sections/footer.html" . }}
{{ end }}
