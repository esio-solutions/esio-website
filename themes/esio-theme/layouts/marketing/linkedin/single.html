<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex,nofollow">
  <title>ESIO LinkedIn — {{ .Title }}</title>
  <script>
    document.documentElement.dataset.theme =
      new URLSearchParams(location.search).get('theme') || 'dark';
  </script>
  <style>{{ partial "linkedin/styles.html" . | safeCSS }}</style>
</head>
<body>
  {{ partial (printf "linkedin/slide-%s.html" .File.ContentBaseName) . }}
</body>
</html>
