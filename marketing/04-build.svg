<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none" role="img" aria-label="Build your budget from a chart of accounts">
  <!-- Hierarchy connector lines -->
  <path d="M160 76 V 104 M64 104 H 256 M64 104 V 132 M160 104 V 132 M256 104 V 132" stroke="#1B2B6B" stroke-width="2" fill="none"/>

  <!-- Root node: budget -->
  <rect x="116" y="44" width="88" height="32" rx="8" fill="#1B2B6B"/>
  <rect x="128" y="56" width="44" height="4" rx="2" fill="#FFFFFF"/>
  <rect x="128" y="64" width="28" height="3" rx="1.5" fill="#FFFFFF" opacity="0.55"/>
  <circle cx="190" cy="60" r="5" fill="#E07B5B"/>

  <!-- Child: Revenue (terra, up arrow) -->
  <rect x="32" y="132" width="64" height="44" rx="8" fill="#FFFFFF" stroke="#E07B5B" stroke-width="2.5"/>
  <path d="M46 158 L52 150 L58 158" stroke="#E07B5B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <line x1="52" y1="150" x2="52" y2="166" stroke="#E07B5B" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="64" y="148" width="22" height="4" rx="2" fill="#1B2B6B"/>
  <rect x="64" y="158" width="18" height="3" rx="1.5" fill="#1B2B6B" opacity="0.5"/>

  <!-- Child: Expenses (teal, down arrow) -->
  <rect x="128" y="132" width="64" height="44" rx="8" fill="#FFFFFF" stroke="#4DBFB8" stroke-width="2.5"/>
  <path d="M142 158 L148 166 L154 158" stroke="#4DBFB8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <line x1="148" y1="150" x2="148" y2="166" stroke="#4DBFB8" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="160" y="148" width="22" height="4" rx="2" fill="#1B2B6B"/>
  <rect x="160" y="158" width="18" height="3" rx="1.5" fill="#1B2B6B" opacity="0.5"/>

  <!-- Child: Assets (yellow, block icon) -->
  <rect x="224" y="132" width="64" height="44" rx="8" fill="#FFFFFF" stroke="#F5C842" stroke-width="2.5"/>
  <rect x="234" y="148" width="14" height="14" rx="2" fill="none" stroke="#F5C842" stroke-width="2.5"/>
  <rect x="254" y="148" width="22" height="4" rx="2" fill="#1B2B6B"/>
  <rect x="254" y="158" width="18" height="3" rx="1.5" fill="#1B2B6B" opacity="0.5"/>

  <!-- Sub-children peeking under each branch -->
  <rect x="40" y="192" width="48" height="20" rx="5" fill="#FAE8DF"/>
  <rect x="136" y="192" width="48" height="20" rx="5" fill="#FAE8DF"/>
  <rect x="232" y="192" width="48" height="20" rx="5" fill="#FAE8DF"/>
  <!-- thin connectors -->
  <line x1="64" y1="176" x2="64" y2="192" stroke="#1B2B6B" stroke-width="1.5" opacity="0.4"/>
  <line x1="160" y1="176" x2="160" y2="192" stroke="#1B2B6B" stroke-width="1.5" opacity="0.4"/>
  <line x1="256" y1="176" x2="256" y2="192" stroke="#1B2B6B" stroke-width="1.5" opacity="0.4"/>
</svg>
