<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none" role="img" aria-label="Connect your accounting tool to ESIO">
  <!-- Left card: existing accounting tool with ledger rows -->
  <rect x="20" y="56" width="100" height="128" rx="12" fill="#FFFFFF" stroke="#1B2B6B" stroke-width="2.5"/>
  <rect x="20" y="56" width="100" height="20" fill="#FAE8DF"/>
  <rect x="20" y="56" width="100" height="20" rx="12" fill="#FAE8DF"/>
  <rect x="20" y="64" width="100" height="12" fill="#FAE8DF"/>
  <line x1="20" y1="76" x2="120" y2="76" stroke="#1B2B6B" stroke-width="2.5"/>

  <rect x="32" y="88" width="36" height="6" rx="3" fill="#1B2B6B" opacity="0.6"/>
  <rect x="80" y="88" width="28" height="6" rx="3" fill="#E07B5B"/>
  <rect x="32" y="104" width="36" height="6" rx="3" fill="#1B2B6B" opacity="0.6"/>
  <rect x="80" y="104" width="20" height="6" rx="3" fill="#E07B5B"/>
  <rect x="32" y="120" width="36" height="6" rx="3" fill="#1B2B6B" opacity="0.6"/>
  <rect x="80" y="120" width="24" height="6" rx="3" fill="#E07B5B"/>
  <rect x="32" y="136" width="36" height="6" rx="3" fill="#1B2B6B" opacity="0.6"/>
  <rect x="80" y="136" width="16" height="6" rx="3" fill="#E07B5B"/>
  <rect x="32" y="152" width="36" height="6" rx="3" fill="#1B2B6B" opacity="0.6"/>
  <rect x="80" y="152" width="32" height="6" rx="3" fill="#E07B5B"/>
  <rect x="32" y="168" width="36" height="6" rx="3" fill="#1B2B6B" opacity="0.6"/>
  <rect x="80" y="168" width="20" height="6" rx="3" fill="#E07B5B"/>

  <!-- Right card: ESIO clock-O -->
  <rect x="200" y="56" width="100" height="128" rx="12" fill="#1B2B6B"/>
  <circle cx="250" cy="120" r="36" fill="none" stroke="#FFFFFF" stroke-width="9"/>
  <!-- Clock hands inside the O -->
  <line x1="250" y1="120" x2="250" y2="100" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="250" y1="120" x2="266" y2="120" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <circle cx="250" cy="120" r="2.5" fill="#FFFFFF"/>

  <!-- Sync arrows between the two cards -->
  <path d="M124 98 Q160 78 196 98" stroke="#E07B5B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M189 92 L196 98 L191 106" stroke="#E07B5B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M196 144 Q160 164 124 144" stroke="#4DBFB8" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M131 150 L124 144 L129 136" stroke="#4DBFB8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
