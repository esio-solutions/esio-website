<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none" role="img" aria-label="The platform calculates cashflow, liquidity, tax, debt, and balance sheet">
  <!-- ESIO square logo — canonical brand mark, theme-aware. Two nested
       <svg>s embed logo-square-light.svg and logo-square-dark.svg
       verbatim; .logo-light / .logo-dark classes hook into the site-wide
       per-theme display:none toggle defined in styles.css. -->
  <g class="logo-light">
    <svg x="32" y="72" width="96" height="96" viewBox="345 6 176 176">
      <rect x="345" y="6" width="176" height="176" rx="20" fill="#fff"/>
      <path fill="#325080" fill-rule="evenodd" d="M430.38,174.13l-5.34-.47A74.83,74.83,0,0,1,386.63,159c-16-11.88-26.09-27.62-30-47.14a73.79,73.79,0,0,1,5.85-47.58c10.41-21.56,27.19-36,50.47-41.8,29.11-7.22,54.51.35,75.51,21.77a72,72,0,0,1,19.75,39c3.95,23.22-1.42,44.22-16.32,62.52a75,75,0,0,1-44.67,26.76c-4,.8-8.07.95-12.11,1.41a4,4,0,0,0-.66.17Zm41.36-30.28,10-10.69L445,96.45l36.1-36.06a58.05,58.05,0,0,0-8.84-9.46L425.5,97.66C440.76,112.89,456.1,128.22,471.74,143.85Z"/>
    </svg>
  </g>
  <g class="logo-dark">
    <svg x="32" y="72" width="96" height="96" viewBox="345 6 176 176">
      <rect x="345" y="6" width="176" height="176" rx="20" fill="#325080"/>
      <path fill="#fff" fill-rule="evenodd" d="M430.38,174.13l-5.34-.47A74.83,74.83,0,0,1,386.63,159c-16-11.88-26.09-27.62-30-47.14a73.79,73.79,0,0,1,5.85-47.58c10.41-21.56,27.19-36,50.47-41.8,29.11-7.22,54.51.35,75.51,21.77a72,72,0,0,1,19.75,39c3.95,23.22-1.42,44.22-16.32,62.52a75,75,0,0,1-44.67,26.76c-4,.8-8.07.95-12.11,1.41a4,4,0,0,0-.66.17Zm41.36-30.28,10-10.69L445,96.45l36.1-36.06a58.05,58.05,0,0,0-8.84-9.46L425.5,97.66C440.76,112.89,456.1,128.22,471.74,143.85Z"/>
    </svg>
  </g>

  <!-- Output flow lines — branching orthogonal arrows from the logo to
       each tile. Each path: short trunk right from logo (128,120) →
       rounded corner at x=170 → vertical along the manifold → rounded
       corner at the tile's y → short branch right into the tile.
       Rounded corners use Q (radius 6) for soft 90° turns. Stroke is
       --color-on-surface so it reads against any theme. -->
  <path d="M 128 120 L 164 120 Q 170 120 170 114 L 170 66 Q 170 60 176 60 L 220 60"
        stroke="var(--color-on-surface)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.55"/>
  <path d="M 128 120 L 164 120 Q 170 120 170 114 L 170 102 Q 170 96 176 96 L 220 96"
        stroke="var(--color-on-surface)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.55"/>
  <path d="M 128 120 L 164 120 Q 170 120 170 126 Q 170 132 176 132 L 220 132"
        stroke="var(--color-on-surface)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.55"/>
  <path d="M 128 120 L 164 120 Q 170 120 170 126 L 170 162 Q 170 168 176 168 L 220 168"
        stroke="var(--color-on-surface)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.55"/>
  <path d="M 128 120 L 164 120 Q 170 120 170 126 L 170 198 Q 170 204 176 204 L 220 204"
        stroke="var(--color-on-surface)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.55"/>

  <!-- Tile 1: Cashflow (wavy line) -->
  <rect x="220" y="44" width="80" height="32" rx="8" fill="#FFFFFF" stroke="#1B2B6B" stroke-width="2"/>
  <path d="M 228 60 Q 232 54 236 60 T 244 60 T 252 60" stroke="#E07B5B" stroke-width="2" stroke-linecap="round" fill="none"/>
  <rect x="258" y="54" width="34" height="4" rx="2" fill="#1B2B6B"/>
  <rect x="258" y="62" width="22" height="3" rx="1.5" fill="#1B2B6B" opacity="0.5"/>

  <!-- Tile 2: Liquidity (droplet) -->
  <rect x="220" y="80" width="80" height="32" rx="8" fill="#FFFFFF" stroke="#1B2B6B" stroke-width="2"/>
  <path d="M 240 86 Q 230 98 240 104 Q 250 98 240 86 Z" fill="#4DBFB8"/>
  <rect x="258" y="90" width="34" height="4" rx="2" fill="#1B2B6B"/>
  <rect x="258" y="98" width="22" height="3" rx="1.5" fill="#1B2B6B" opacity="0.5"/>

  <!-- Tile 3: Tax (percent) -->
  <rect x="220" y="116" width="80" height="32" rx="8" fill="#FFFFFF" stroke="#1B2B6B" stroke-width="2"/>
  <circle cx="232" cy="126" r="3" fill="none" stroke="#F5C842" stroke-width="2"/>
  <line x1="228" y1="140" x2="244" y2="124" stroke="#F5C842" stroke-width="2" stroke-linecap="round"/>
  <circle cx="244" cy="138" r="3" fill="none" stroke="#F5C842" stroke-width="2"/>
  <rect x="258" y="126" width="34" height="4" rx="2" fill="#1B2B6B"/>
  <rect x="258" y="134" width="22" height="3" rx="1.5" fill="#1B2B6B" opacity="0.5"/>

  <!-- Tile 4: Debt (linked circles) -->
  <rect x="220" y="152" width="80" height="32" rx="8" fill="#FFFFFF" stroke="#1B2B6B" stroke-width="2"/>
  <circle cx="234" cy="167" r="7" fill="none" stroke="#6B5B9E" stroke-width="2"/>
  <circle cx="246" cy="167" r="7" fill="none" stroke="#6B5B9E" stroke-width="2"/>
  <rect x="258" y="162" width="34" height="4" rx="2" fill="#1B2B6B"/>
  <rect x="258" y="170" width="22" height="3" rx="1.5" fill="#1B2B6B" opacity="0.5"/>

  <!-- Tile 5: Balance (stacked columns) -->
  <rect x="220" y="188" width="80" height="32" rx="8" fill="#FFFFFF" stroke="#1B2B6B" stroke-width="2"/>
  <rect x="228" y="196" width="6" height="16" rx="1" fill="#E07B5B"/>
  <rect x="238" y="200" width="6" height="12" rx="1" fill="#E07B5B" opacity="0.7"/>
  <rect x="248" y="204" width="6" height="8" rx="1" fill="#E07B5B" opacity="0.5"/>
  <rect x="258" y="200" width="34" height="4" rx="2" fill="#1B2B6B"/>
  <rect x="258" y="208" width="22" height="3" rx="1.5" fill="#1B2B6B" opacity="0.5"/>
</svg>
